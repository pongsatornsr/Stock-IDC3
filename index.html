  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>INET IDC-3 Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Noto+Sans+Thai:wght@300;400;500;700&family=Space+Mono&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
  /* ══ PORTAL ══ */
  :root {
    --p-bg:#07111E; --p-surface:rgba(255,255,255,0.065); --p-surface2:rgba(255,255,255,0.12);
    --p-teal:#09D1C7; --p-mid:#15919B; --p-txt:#E8F4F6;
    --p-txt2:rgba(255,255,255,0.55); --p-txt3:rgba(255,255,255,0.32);
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:var(--p-bg);}
  body{font-family:'Noto Sans Thai',sans-serif;color:var(--p-txt);}
  #portal-shell{position:fixed;inset:0;max-width:390px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;z-index:1;}
  .p-bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .p-bg-grad{position:absolute;inset:0;background:radial-gradient(ellipse 90% 55% at 15% 0%,rgba(9,209,199,0.20) 0%,transparent 55%),radial-gradient(ellipse 70% 50% at 90% 100%,rgba(70,223,177,0.14) 0%,transparent 55%),linear-gradient(180deg,#071520 0%,#07111E 50%,#060E1A 100%);}
  .p-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(9,209,199,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(9,209,199,0.04) 1px,transparent 1px);background-size:48px 48px;animation:pGridDrift 30s ease-in-out infinite;}
  @keyframes pGridDrift{0%,100%{transform:translateY(0);}50%{transform:translateY(-24px);}}
  .p-orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;animation:pOrbFloat ease-in-out infinite;}
  .p-orb-1{width:400px;height:400px;top:-120px;right:-80px;background:radial-gradient(circle,rgba(9,209,199,0.22) 0%,transparent 65%);animation-duration:12s;}
  .p-orb-2{width:350px;height:350px;bottom:-100px;left:-80px;background:radial-gradient(circle,rgba(70,223,177,0.18) 0%,transparent 65%);animation-duration:15s;animation-delay:-4s;}
  @keyframes pOrbFloat{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(20px,-25px) scale(1.07);}66%{transform:translate(-15px,12px) scale(0.95);}}
  .p-header{padding:54px 20px 16px;animation:pSlideDown 0.65s cubic-bezier(0.16,1,0.3,1) both;flex-shrink:0;}
  @keyframes pSlideDown{from{opacity:0;transform:translateY(-18px);}to{opacity:1;transform:none;}}
  .p-company-logo{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);border-radius:18px;backdrop-filter:blur(8px);}
  .p-inet-badge{background:linear-gradient(135deg,var(--p-teal),var(--p-mid));color:#fff;font-family:'Outfit',sans-serif;font-weight:900;font-size:15px;padding:6px 16px;border-radius:100px;letter-spacing:1.5px;box-shadow:0 4px 14px rgba(9,209,199,0.38);flex-shrink:0;}
  .p-company-name{font-family:'Noto Sans Thai',sans-serif;font-size:12px;color:var(--p-txt2);line-height:1.4;}
  .p-live-dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--p-teal);flex-shrink:0;animation:pLiveDot 2.2s ease-in-out infinite;box-shadow:0 0 8px var(--p-teal);}
  @keyframes pLiveDot{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.55);opacity:0.65;}}
  .p-section-label{font-family:'Space Mono',monospace;font-size:10px;color:var(--p-txt3);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
  .p-app-grid{padding:0 2px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex-shrink:0;}
  .p-app-card{display:flex;flex-direction:column;align-items:center;padding:14px 6px 11px;border-radius:22px;background:var(--p-surface);border:1px solid rgba(255,255,255,0.09);cursor:pointer;transition:transform 0.24s cubic-bezier(0.34,1.56,0.64,1),background 0.18s,box-shadow 0.22s,border-color 0.18s;position:relative;overflow:hidden;animation:pCardIn 0.55s cubic-bezier(0.16,1,0.3,1) both;user-select:none;-webkit-user-select:none;}
  .p-app-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.16),transparent);}
  @keyframes pCardIn{from{opacity:0;transform:translateY(22px) scale(0.88);}to{opacity:1;transform:none;}}
  .p-app-card:nth-child(1){animation-delay:0.12s;}
  .p-app-card:nth-child(2){animation-delay:0.22s;}
  .p-app-card:nth-child(3){animation-delay:0.32s;}
  .p-app-card:nth-child(4){animation-delay:0.42s;}
  .p-app-card:active{transform:scale(0.87)!important;transition-duration:0.07s!important;}
  .p-app-card:hover{background:var(--p-surface2);box-shadow:0 10px 28px rgba(9,209,199,0.18),0 4px 10px rgba(0,0,0,0.3);border-color:rgba(9,209,199,0.32);transform:translateY(-5px) scale(1.04);}
  .p-app-icon{width:56px;height:56px;border-radius:16px;margin-bottom:9px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden;}
  .p-app-name{font-family:'Noto Sans Thai',sans-serif;font-size:11px;font-weight:600;color:var(--p-txt);text-align:center;line-height:1.3;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .p-app-sub{font-size:9px;color:var(--p-txt3);margin-top:2px;text-align:center;font-family:'Space Mono',monospace;letter-spacing:0.5px;}
  .p-clock-strip{margin:18px 2px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;animation:pFadeUp 0.5s ease 0.6s both;}
  @keyframes pFadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .p-clock{font-family:'Space Mono',monospace;font-size:11px;color:var(--p-txt3);letter-spacing:1px;}
  .p-divider{height:1px;flex:1;margin:0 12px;background:linear-gradient(90deg,transparent,rgba(9,209,199,0.18),transparent);}

  /* ══ APP OVERLAY ══ */

        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 44px 44px;
      transform-origin: center bottom;
      animation: emp-grid-in 1.6s cubic-bezier(0.22,1,0.36,1) 0.15s both,
                 emp-grid-drift 22s ease-in-out infinite 2s;
    }
    /* Depth orbs */
    .emp-cin-orb {
      position:absolute; border-radius:50%;
      filter:blur(55px); pointer-events:none;
    }
    .emp-cin-orb-1 {
      width:340px; height:340px; top:-100px; right:-90px;
      background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(9,209,199,0.22) 40%, transparent 70%);
      animation: emp-orb-drift-a 10s ease-in-out infinite;
    }
    .emp-cin-orb-2 {
      width:280px; height:280px; bottom:-70px; left:-70px;
      background: radial-gradient(circle, rgba(70,223,177,0.20) 0%, rgba(9,209,199,0.12) 50%, transparent 70%);
      animation: emp-orb-drift-b 13s ease-in-out infinite;
    }
    .emp-cin-orb-3 {
      width:200px; height:200px; top:40%; left:25%;
      background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 65%);
      animation: emp-orb-drift-c 16s ease-in-out infinite 1.5s;
    }
    /* Vignette */
    .emp-cin-vignette {
      position:absolute; inset:0;
      background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 35%, rgba(5,30,45,0.42) 100%);
      animation: emp-vignette-in 1.2s ease both;
    }
    /* Scanline sweep on open */
    .emp-cin-scanline {
      position:absolute; left:0; right:0; top:0; height:2px;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.55) 40%, rgba(9,209,199,0.85) 50%, rgba(255,255,255,0.55) 60%, transparent 100%);
      box-shadow: 0 0 14px rgba(9,209,199,0.6), 0 0 28px rgba(9,209,199,0.2);
      animation: emp-scanline-sweep 2.8s cubic-bezier(0.4,0,0.6,1) 0.3s 1 forwards;
      z-index:10;
    }
    /* Floating particles */
    .emp-cin-particles {
      position:absolute; inset:0; overflow:hidden; pointer-events:none;
    }
    .emp-cin-pt {
      position:absolute; border-radius:50%;
      background: rgba(255,255,255,0.55);
      animation: emp-particle linear infinite;
    }
    /* Top shimmer line */
    .emp-overlay::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:3px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255,255,255,0.45) 25%,
        rgba(9,209,199,0.80) 50%,
        rgba(255,255,255,0.45) 75%,
        transparent 100%);
      background-size:200% auto;
      animation: emp-shimmer-border 3.5s linear infinite 0.8s;
      z-index:20;
    }
    /* Topbar glass — upgraded depth */
    .emp-cin-topbar-wrap { position:relative; z-index:10; flex-shrink:0; }
    .emp-topbar{
      background:rgba(255,255,255,0.18);
      backdrop-filter:blur(22px) saturate(160%);
      -webkit-backdrop-filter:blur(22px) saturate(160%);
      border-bottom:1px solid rgba(255,255,255,0.28);
      flex-shrink:0;
      padding:env(safe-area-inset-top,0) 0 0;
      box-shadow: 0 4px 24px rgba(5,30,45,0.12);
    }
    .emp-topbar-inner{padding:14px 16px 10px;}
    .emp-tb-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .emp-brand{display:flex;align-items:center;gap:7px;}
    .emp-brand-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:emp-brand-dot-pulse 2.2s ease-in-out infinite;box-shadow:0 0 8px #fff;}
    .emp-brand-name{color:var(--emp-dark);font-family:'Prompt',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:2px;}
    .emp-close-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.5);border:1px solid var(--emp-border);color:var(--emp-dark);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .emp-search-wrap{position:relative;}
    .emp-search-wrap input{

    /* Filter Bar — enhanced depth */
    .emp-fbar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; border-bottom: 1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.08); }
    .emp-fbar::-webkit-scrollbar { display: none; }
    .emp-fb { padding: 6px 14px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.30); background: rgba(255,255,255,0.18); font-size: 0.75rem; font-weight: 600; color: var(--emp-dark); white-space: nowrap; cursor: pointer; transition: background 0.22s ease, border-color 0.22s ease, transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.22s ease; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .emp-fb:active { transform: scale(0.93); }
    .emp-fb.active { background: var(--emp-dark); color: #fff; border-color: var(--emp-dark); box-shadow: 0 4px 14px rgba(35,52,70,0.28), 0 0 0 2px rgba(9,209,199,0.20); }

    /* Grid Layout */
    .emp-grid-list { flex: 1; overflow-y: auto; padding: 14px 14px 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; align-items: start; scrollbar-width: none; position:relative; z-index:5; }
    .emp-grid-list::-webkit-scrollbar { display: none; }
    .emp-grid-card {
      background: rgba(255,255,255,0.30);

        0 8px 24px rgba(5,30,45,0.10),
        0 2px 0 rgba(255,255,255,0.40) inset,

      animation: emp-card-wave 0.42s cubic-bezier(0.16,1,0.3,1) both;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      overflow: visible; padding: 14px 10px 12px;
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      position: relative;
    }
    /* Subtle inner highlight on each card */
    .emp-grid-card::before {
      content:'';
      position:absolute; inset:0; border-radius:17px;
      background: linear-gradient(145deg, rgba(255,255,255,0.35) 0%, transparent 50%);
      pointer-events:none;
    }
    
    .emp-avatar{width:56px;height:56px;min-height:56px;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,0.7);flex-shrink:0;background:rgba(255,255,255,0.45);position:relative;box-shadow:0 6px 18px rgba(5,30,45,0.14),0 0 0 0 rgba(9,209,199,0);margin-bottom:8px;transition:box-shadow 0.3s cubic-bezier(0.22,1,0.36,1),transform 0.3s cubic-bezier(0.22,1,0.36,1);}
    .emp-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
    .emp-avatar-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:var(--emp-dark);background:linear-gradient(135deg,rgba(255,255,255,0.7),rgba(255,255,255,0.3));font-family:'Prompt',sans-serif;}
    
    .emp-name{font-family:'Prompt',sans-serif;font-size:0.75rem;font-weight:700;color:var(--emp-dark);line-height:1.3;margin-bottom:2px;width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .emp-pos{font-size:0.65rem;color:var(--emp-muted);margin-bottom:6px;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
    .emp-id-badge{
      background:rgba(255,255,255,0.60);
      border:1px solid rgba(255,255,255,0.80);
      border-radius:6px; padding:2px 6px;
      font-size:0.6rem; font-weight:700; color:var(--emp-dark);
      font-family:'Space Mono',monospace; margin-bottom:10px;

    }
    
    .emp-grid-acts { display: flex; gap: 8px; width: 100%; }
    .emp-grid-acts button { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.50); color: var(--emp-dark); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; cursor: pointer; transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), background 0.18s ease, box-shadow 0.2s ease; box-shadow: 0 2px 6px rgba(5,30,45,0.06); backdrop-filter:blur(4px); }
    .emp-grid-acts button:hover { background: rgba(255,255,255,0.72); box-shadow: 0 4px 12px rgba(9,209,199,0.20); }
    .emp-grid-acts button:active { transform: scale(0.90); background: #fff; }
    .emp-grid-acts button.disabled { opacity: 0.35; pointer-events: none; }
    .emp-select-chip{
      background: linear-gradient(135deg, var(--emp-dark) 0%, #0C5060 100%);
      color:#fff; border-radius:10px; padding:7px;
      font-size:0.75rem; font-weight:600; width:100%; cursor:pointer;
      font-family:'Noto Sans Thai',sans-serif; border:none;
      margin-top:8px;
      box-shadow: 0 4px 12px rgba(5,30,45,0.22);
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease;
    }
    .emp-select-chip:hover { box-shadow: 0 6px 18px rgba(9,209,199,0.30); }
    .emp-select-chip:active { transform: scale(0.94); }

    .emp-link-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:100px;background:var(--teal-dim);border:1px solid var(--teal-border);color:var(--mid-teal);font-size:11px;font-weight:600;cursor:pointer;font-family:'Noto Sans Thai',sans-serif;}

    /* ═══════════════════════════════════════════════════
       CINEMATIC INNER-PAGE SYSTEM
       Parallax depth · Smooth easing · Volumetric light
    ═══════════════════════════════════════════════════ */

    /* Page enter animations */
    @keyframes pg-rise {
      0%   { opacity:0; transform: translateY(30px) scale(0.97); filter:blur(5px); }
      50%  { filter:blur(0); }
      100% { opacity:1; transform: translateY(0) scale(1); filter:blur(0); }
    }
    @keyframes pg-slide-right {
      0%   { opacity:0; transform: translateX(28px); }
      100% { opacity:1; transform: translateX(0); }
    }
    @keyframes pg-slide-left {
      0%   { opacity:0; transform: translateX(-28px); }
      100% { opacity:1; transform: translateX(0); }
    }
    @keyframes cin-stagger-in {
      0%   { opacity:0; transform: translateY(14px) scale(0.97); }
      100% { opacity:1; transform: translateY(0) scale(1); }
    }
    @keyframes cin-float-slow {
      0%,100% { transform: translateY(0px); }
      50%      { transform: translateY(-9px); }
    }
    @keyframes cin-glow-pulse {
      0%,100% { box-shadow: 0 0 0 4px var(--bg), 0 6px 20px rgba(9,209,199,0.35); }
      50%      { box-shadow: 0 0 0 5px var(--bg), 0 8px 32px rgba(9,209,199,0.65), 0 0 40px rgba(9,209,199,0.25); }
    }
    @keyframes cin-shimmer-card {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }
    @keyframes cin-depth-bg {
      0%,100% { transform: scale(1) translateY(0); }
      50%      { transform: scale(1.015) translateY(-4px); }
    }
    @keyframes cin-orb-inner-1 {
      0%,100% { transform: translate(0,0) scale(1); }
      40%     { transform: translate(18px,-22px) scale(1.1); }
      70%     { transform: translate(-12px,10px) scale(0.95); }
    }
    @keyframes cin-orb-inner-2 {
      0%,100% { transform: translate(0,0) scale(1); }
      35%     { transform: translate(-20px,14px) scale(1.07); }
      65%     { transform: translate(10px,-16px) scale(0.97); }
    }
    @keyframes cin-topbar-in {
      0%   { opacity:0; transform: translateY(-20px); filter: blur(4px); }
      100% { opacity:1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes cin-hero-in {
      0%   { opacity:0; transform: perspective(600px) rotateX(8deg) translateY(24px) scale(0.95); filter:blur(6px); }
      55%  { filter:blur(0); }
      100% { opacity:1; transform: perspective(600px) rotateX(0deg) translateY(0) scale(1); }
    }
    @keyframes cin-card-cascade {
      0%   { opacity:0; transform: translateY(28px) scale(0.93); }
      65%  { transform: translateY(-2px) scale(1.01); }
      100% { opacity:1; transform: translateY(0) scale(1); }
    }
    @keyframes cin-stat-counter {
      0%   { transform: scale(1.08); opacity:0.7; }
      100% { transform: scale(1); opacity:1; }
    }
    @keyframes cin-bottom-nav-in {
      0%   { opacity:0; transform: translateX(-50%) translateY(28px); filter: blur(4px); }
      100% { opacity:1; transform: translateX(-50%) translateY(0); filter: blur(0); }
    }
    @keyframes cin-scan-area-pulse {
      0%,100% { border-color: var(--teal-border); box-shadow: 0 0 0 0 rgba(9,209,199,0); }
      50%     { border-color: var(--teal); box-shadow: 0 0 0 6px rgba(9,209,199,0.08); }
    }
    @keyframes cin-emp-card-hover {
      0%   { transform: translateY(0) scale(1); box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
      100% { transform: translateY(-4px) scale(1.015); box-shadow: 0 12px 28px rgba(33,58,88,0.14); }
    }
    @keyframes cin-nav-dot-in {
      0%   { transform: scaleX(0); opacity:0; }
      100% { transform: scaleX(1); opacity:1; }
    }
    @keyframes cin-badge-bounce {
      0%,100% { transform: scale(1); }
      40%     { transform: scale(1.18); }
      70%     { transform: scale(0.94); }
    }
    @keyframes cin-bg-ambient {
      0%,100% { opacity:0.55; transform: scale(1); }
      50%     { opacity:0.7; transform: scale(1.04); }
    }

    /* ─── Page wrapper ─── */
    .page-cinematic {
      animation: pg-rise 0.6s cubic-bezier(0.16,1,0.3,1) both;
      position: relative;
      z-index: 1;
    }

    /* ─── App background ambient layer ─── */
    #root::before {
      content:'';
      position:fixed; inset:0; z-index:0; pointer-events:none;
      background:
        radial-gradient(ellipse 70% 50% at 80% 10%, rgba(9,209,199,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 10% 80%, rgba(70,223,177,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 45% at 50% 50%, rgba(21,145,155,0.04) 0%, transparent 70%);
      animation: cin-bg-ambient 18s ease-in-out infinite;
    }

    /* ─── TopBar cinematic ─── */
    .cin-topbar-wrap {
      animation: cin-topbar-in 0.6s cubic-bezier(0.22,1,0.36,1) 0s both;
    }

    /* ─── Hero card (PageHome big stats) ─── */
    .cin-hero-card {
      animation: cin-hero-in 0.65s cubic-bezier(0.16,1,0.3,1) 0.1s both;
      position:relative;
      overflow:hidden;
    }
    .cin-hero-card::before {
      content:'';
      position:absolute;
      top:-60%; left:-30%;
      width:200%; height:200%;
      background: radial-gradient(ellipse 45% 35% at 65% 40%, rgba(255,255,255,0.10) 0%, transparent 60%);
      pointer-events:none;
      animation: cin-depth-bg 14s ease-in-out infinite;
    }
    .cin-hero-card::after {
      content:'';
      position:absolute; inset:0;
      background: linear-gradient(135deg,
        rgba(255,255,255,0.08) 0%,
        transparent 40%,
        rgba(9,209,199,0.04) 100%);
      pointer-events:none;
    }

    /* ─── Stat cards staggered cascade ─── */
    .cin-stat-1 { animation: cin-card-cascade 0.55s cubic-bezier(0.16,1,0.3,1) 0.20s both; }
    .cin-stat-2 { animation: cin-card-cascade 0.55s cubic-bezier(0.16,1,0.3,1) 0.32s both; }
    .cin-stat-3 { animation: cin-card-cascade 0.55s cubic-bezier(0.16,1,0.3,1) 0.44s both; }
    .cin-stat-4 { animation: cin-card-cascade 0.55s cubic-bezier(0.16,1,0.3,1) 0.56s both; }

    /* ─── Content card depth effect ─── */
    .cin-content-card {
      position: relative;
      transition: box-shadow 0.3s cubic-bezier(0.22,1,0.36,1), transform 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    .cin-content-card::before {
      content:'';
      position:absolute;
      inset:0; border-radius:inherit;
      background: linear-gradient(160deg, rgba(255,255,255,0.6) 0%, transparent 55%);
      pointer-events:none;
      opacity:0.5;
    }

    /* ─── Section label (eyebrow) ─── */
    .cin-eyebrow {
      animation: cin-slide-right 0.4s cubic-bezier(0.22,1,0.36,1) 0.3s both;
      position:relative;
    }
    @keyframes cin-slide-right {
      from { opacity:0; transform:translateX(-10px); }
      to   { opacity:1; transform:translateX(0); }
    }

    /* ─── BottomNav cinematic ─── */
    .cin-bottom-nav {
      animation: cin-bottom-nav-in 0.6s cubic-bezier(0.16,1,0.3,1) 0.15s both;
      position:relative;
    }
    .cin-bottom-nav::before {
      content:'';
      position:absolute; top:0; left:10%; right:10%; height:1px;
      background: linear-gradient(90deg, transparent, rgba(9,209,199,0.3), transparent);
    }
    /* Active nav indicator drop-in */
    .cin-nav-indicator {
      animation: cin-nav-dot-in 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    /* ─── Scan page elements ─── */
    .cin-scan-area {
      animation: pg-rise 0.5s cubic-bezier(0.16,1,0.3,1) 0.1s both,
                 cin-scan-area-pulse 3s ease-in-out 1.5s infinite;
      position:relative;
    }
    .cin-scan-area::after {
      content:'';
      position:absolute; inset:0; border-radius:inherit;
      background: radial-gradient(ellipse 50% 50% at 50% 20%, rgba(9,209,199,0.06) 0%, transparent 70%);
      pointer-events:none;
    }

    /* ─── Item action panel ─── */
    .cin-item-card {
      animation: cin-hero-in 0.5s cubic-bezier(0.16,1,0.3,1) 0.05s both;
      position:relative; overflow:hidden;
    }
    .cin-item-card::before {
      content:'';
      position:absolute; top:-40%; right:-20%;
      width:160%; height:160%;
      background: radial-gradient(ellipse 40% 30% at 70% 35%, rgba(255,255,255,0.15) 0%, transparent 60%);
      pointer-events:none;
      animation: cin-orb-inner-1 12s ease-in-out infinite;
    }

    /* ─── Employee overlay upgraded easing (already in new block above) ── */
    /* Employee grid card hover with depth — ENHANCED */
    .emp-grid-card {
      transition: transform 0.32s cubic-bezier(0.22,1,0.36,1),
                  box-shadow 0.32s cubic-bezier(0.22,1,0.36,1),
                  border-color 0.22s ease,
                  background 0.22s ease;
      will-change: transform;
      cursor:pointer;
    }
    .emp-grid-card:hover {
      transform: translateY(-6px) scale(1.025);
      box-shadow:
        0 20px 44px rgba(5,30,45,0.20),
        0 2px 0 rgba(255,255,255,0.5) inset !important;
      border-color: rgba(255,255,255,0.90) !important;
      background: rgba(255,255,255,0.42) !important;
    }
    .emp-grid-card:active {
      transform: scale(0.96) !important;
      transition-duration: 0.08s !important;
    }
    /* Avatar teal glow on card hover */
    .emp-grid-card:hover .emp-avatar {
      box-shadow:
        0 8px 24px rgba(9,209,199,0.40),
        0 0 0 3px rgba(255,255,255,0.65) !important;
      transform: translateY(-2px) scale(1.04);
    }
    /* Card cascade on open */
    .emp-overlay.open .emp-grid-card {
      animation: emp-card-wave 0.42s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* ─── Pin Modal depth ─── */
    .cin-pin-overlay {
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
    }
    .cin-pin-sheet {
      animation: pg-rise 0.45s cubic-bezier(0.16,1,0.3,1) both;
      position:relative;
      overflow:hidden;
    }
    .cin-pin-sheet::before {
      content:'';
      position:absolute; top:0; left:10%; right:10%; height:1px;
      background: linear-gradient(90deg, transparent, rgba(9,209,199,0.35), transparent);
    }

    /* ─── Log rows depth entrance ─── */
    .cin-log-row {
      animation: cin-card-cascade 0.35s cubic-bezier(0.16,1,0.3,1) both;
      transition: background 0.2s ease;
    }
    .cin-log-row:hover {
      background: rgba(9,209,199,0.03);
    }

    /* ─── Buttons cinematic press ─── */
    button:not([style*="transform"]) {
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease;
    }
    button:active {
      transform: scale(0.95) !important;
      transition-duration: 0.05s !important;
    }
    /* Override React inline transition for nav buttons */
    .cin-bottom-nav button:active {
      transform: scale(0.88) !important;
    }

    /* ─── Input focus depth ─── */
    input:focus {
      transition: border-color 0.2s ease, box-shadow 0.3s cubic-bezier(0.22,1,0.36,1) !important;
    }

    /* ─── Scan button float ─── */
    .cin-scan-fab {
      animation: cin-float-slow 2.8s ease-in-out infinite, cin-glow-pulse 2.8s ease-in-out infinite !important;
    }

    /* ─── Toast pop ─── */
    @keyframes cin-toast-pop {
      0%   { opacity:0; transform:translateX(-50%) translateY(10px) scale(0.88); filter:blur(3px); }
      60%  { filter:blur(0); }
      100% { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
    }

    /* ─── Page content wrapper depth parallax overlay ─── */
    .cin-page-bg {
      position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
    }
    .cin-page-orb-a {
      position:fixed;
      width:360px; height:360px; border-radius:50%;
      background: radial-gradient(circle, rgba(9,209,199,0.13) 0%, transparent 65%);
      top:-100px; right:-100px;
      animation: cin-orb-inner-1 14s ease-in-out infinite;
      filter:blur(30px);
      z-index:0; pointer-events:none;
    }
    .cin-page-orb-b {
      position:fixed;
      width:300px; height:300px; border-radius:50%;
      background: radial-gradient(circle, rgba(70,223,177,0.10) 0%, transparent 65%);
      bottom:-80px; left:-80px;
      animation: cin-orb-inner-2 17s ease-in-out infinite;
      filter:blur(28px);
      z-index:0; pointer-events:none;
    }

    /* ─── Admin/Setup card depth ─── */
    .cin-admin-card {
      animation: pg-rise 0.48s cubic-bezier(0.16,1,0.3,1) 0.08s both;
      position:relative; overflow:hidden;
    }
    .cin-admin-card::after {
      content:'';
      position:absolute; top:0; left:0; right:0; height:1px;
      background: linear-gradient(90deg, transparent, rgba(9,209,199,0.3), transparent);
    }

    /* ─── Section divider light line ─── */
    .cin-divider-light {
      height:1px;
      background: linear-gradient(90deg, transparent, rgba(9,209,199,0.25), transparent);
      border:none; margin:0;
    }

    /* ─── Search result drop depth ─── */
    .cin-search-drop {
      animation: slideDown 0.22s cubic-bezier(0.16,1,0.3,1) both;
      position:relative;
    }
    .cin-search-drop::before {
      content:'';
      position:absolute; top:0; left:8%; right:8%; height:1px;
      background: linear-gradient(90deg, transparent, rgba(9,209,199,0.25), transparent);
    }

    /* ─── Smooth scroll for inner lists ─── */
    .emp-grid-list,
    [style*="overflow-y: auto"],
    [style*="overflowY:'auto'"] {
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    /* ─── Status dot glow ─── */
    @keyframes cin-status-glow {
      0%,100% { box-shadow: 0 0 0 0 currentColor; opacity:1; }
      50%     { box-shadow: 0 0 6px 2px currentColor; opacity:0.85; }
    }
  </style>
</head>

</div>

<script type="text/plain" id="gas-template">// ═══════════════════════════════════════════════════
// StockScan IDC-3 — Google Apps Script
// ── ตั้งค่า LINE Messaging API ──────────────────────
// 1) วาง Channel Access Token จาก LINE Developers
// 2) วาง Group ID ของกลุ่มที่ต้องการแจ้งเตือน
// ════════════════════════════════════════════════════
var LINE_TOKEN = "";   // ← วาง Channel Access Token ตรงนี้
var LINE_GROUP = "";   // ← วาง Group ID ตรงนี้

function sendLine(msg) {
  if (!LINE_TOKEN || !LINE_GROUP) return;
  try {
    UrlFetchApp.fetch("https://api.line.me/v2/bot/message/push", {
      method: "post",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + LINE_TOKEN },
      payload: JSON.stringify({ to: LINE_GROUP, messages: [{ type: "text", text: msg }] }),
      muteHttpExceptions: true
    });
  } catch(e) { Logger.log("LINE error: " + e); }
}

function doGet(e){
  var ss=SpreadsheetApp.getActiveSpreadsheet();
  var iS=ss.getSheetByName("Items"),lS=ss.getSheetByName("Logs"),aS=ss.getSheetByName("Auth");
  if(!iS){iS=ss.insertSheet("Items");iS.appendRow(["ID","Name","Category","Stock","Unit","Min","Icon"]);}
  if(!lS){lS=ss.insertSheet("Logs");lS.appendRow(["Timestamp","QR_ID","Item_Name","Category","Quantity","Unit","Employee","Employee_ID","Note","Action"]);}
  if(!aS){aS=ss.insertSheet("Auth");aS.appendRow(["Employee_ID","Hash","Changed","UpdatedAt"]);}
  var authObj={};
  var aVals=aS.getDataRange().getValues();
  for(var i=1;i<aVals.length;i++){
    if(aVals[i][0])authObj[String(aVals[i][0])]={hash:String(aVals[i][1]),changed:aVals[i][2]===true||aVals[i][2]==='TRUE'||aVals[i][2]===1,updatedAt:String(aVals[i][3]||'')};
  }
  var payload=JSON.stringify({items:getItems(iS),logs:getLogs(lS),auth:authObj});
  var cb=e&&e.parameter&&e.parameter.callback;
  if(cb)return ContentService.createTextOutput(cb+"("+payload+")").setMimeType(ContentService.MimeType.JAVASCRIPT);
  return ContentService.createTextOutput(payload).setMimeType(ContentService.MimeType.JSON);
}
function doPost(e){const ss=SpreadsheetApp.getActiveSpreadsheet();const iS=ss.getSheetByName("Items")||ss.insertSheet("Items");const lS=ss.getSheetByName("Logs")||ss.insertSheet("Logs");const aS=ss.getSheetByName("Auth")||(()=>{var s=ss.insertSheet("Auth");s.appendRow(["Employee_ID","Hash","Changed","UpdatedAt"]);return s;})();const data=JSON.parse(e.postData.contents);
  if(data.action==="set_password"){
    var aVals=aS.getDataRange().getValues();var found=false;
    for(var i=1;i<aVals.length;i++){if(String(aVals[i][0])===String(data.employee_id)){aS.getRange(i+1,2,1,3).setValues([[data.hash,true,data.updatedAt||new Date().toISOString()]]);found=true;break;}}
    if(!found)aS.appendRow([data.employee_id,data.hash,true,data.updatedAt||new Date().toISOString()]);
  }else if(data.action==="add_items"){data.items.forEach(it=>iS.appendRow([it.id,it.name,it.cat,it.stock,it.unit,it.min,it.icon]));}else if(["withdraw","return","restock"].includes(data.action)){lS.appendRow([data.timestamp,data.qr_id,data.item_name,data.category,data.quantity,data.unit,data.employee_name||data.employee,data.employee_id||"",data.note||"",data.action]);const vals=iS.getDataRange().getValues();for(let i=1;i<vals.length;i++){if(String(vals[i][0])===String(data.qr_id)){const cur=Number(vals[i][3]);let next=cur;if(data.action==="withdraw")next=Math.max(0,cur-Number(data.quantity));else next=cur+Number(data.quantity);iS.getRange(i+1,4).setValue(next);break;}}
  var icon=data.action==="withdraw"?"📤":data.action==="return"?"📥":"📦";
  var label=data.action==="withdraw"?"เบิกของ":data.action==="return"?"คืนของ":"เติม Stock";
  var d=new Date();
  var ds=Utilities.formatDate(d,Session.getScriptTimeZone(),"d MMM yyyy HH:mm");
  var msg=icon+" แจ้งเตือน"+label+" — IDC-3\n"
    +"👤 พนักงาน: "+(data.employee_name||data.employee||"-")+"\n"
    +"📋 รายการ: "+data.item_name+"\n"
    +"🔢 จำนวน: "+data.quantity+" "+data.unit+"\n"
    +"🕐 เวลา: "+ds;
  sendLine(msg);
  }else if(data.action==="delete_item"){const vals=iS.getDataRange().getValues();for(let i=1;i<vals.length;i++){if(String(vals[i][0])===String(data.id)){iS.deleteRow(i+1);break;}}}return ContentService.createTextOutput(JSON.stringify({status:"ok"})).setMimeType(ContentService.MimeType.JSON);}
function getItems(sheet){const rows=sheet.getDataRange().getValues();if(rows.length<2)return[];const h=rows[0].map(c=>String(c).trim().toLowerCase());const col=k=>h.indexOf(k);return rows.slice(1).map(r=>({id:String(r[col('id')]||''),name:String(r[col('name')]||''),cat:String(r[col('category')]||r[col('cat')]||''),stock:Number(r[col('stock')])||0,unit:String(r[col('unit')]||'อัน'),min:Number(r[col('min')])||0,icon:String(r[col('icon')]||'📦')})).filter(it=>it.id);}
function getLogs(sheet){const rows=sheet.getDataRange().getValues();if(rows.length<2)return[];return rows.slice(1).reverse().slice(0,100).map(r=>{let qty=parseInt(r[4]);if(isNaN(qty))qty=0;return{timestamp:String(r[0]||''),qr_id:String(r[1]||''),item_name:String(r[2]||''),category:String(r[3]||''),quantity:qty,unit:String(r[5]||''),employee:String(r[6]||''),employee_id:String(r[7]||''),note:String(r[8]||''),action:String(r[9]||'withdraw')};});}

/* ══════════════════════════════════════════════════════
   AUTH SYSTEM v3 — GAS-backed persistent passwords
   ─────────────────────────────────────────────────────
   รหัสผ่านเริ่มต้น = ตัดตัวอักษรออกจาก ID
     OD1162769  → 1162769
     20085      → 20085
     671166     → 671166
   บังคับเปลี่ยนครั้งแรก → เก็บใน GAS Sheet "Auth"
   ── sync กลับมาทุกครั้งที่เปิด App ──────────────────
══════════════════════════════════════════════════════ */

function getDefaultPassword(empId){
  // ตัดตัวอักษร (a-z, A-Z) ออกทั้งหมด เหลือแต่ตัวเลข
  return empId.replace(/[A-Za-z]/g,'');
}

/* Auth state อยู่ใน React context — ไม่ใช้ localStorage เป็น source of truth
   แต่ยัง cache ไว้ใน localStorage เป็น fallback ระหว่างรอ sync */
function loadAuthCache(){try{return JSON.parse(localStorage.getItem('ss2_auth_v3'))||{};}catch(e){return{};}}
function saveAuthCache(data){try{localStorage.setItem('ss2_auth_v3',JSON.stringify(data));}catch(e){}}

/* Simple hash (FNV-1a 32bit) — ไม่ส่ง plaintext ไป sheet */
function hashPin(pin){
  let h=2166136261;
  for(let i=0;i<pin.length;i++){h^=pin.charCodeAt(i);h=(h*16777619)>>>0;}
  return h.toString(16).padStart(8,'0');
}

function LoginScreen({onLogin, authData, isSyncing}){
  const [username,setUsername]=useState('');
  const [password,setPassword]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const [doShakeNow,setDoShakeNow]=useState(false);
  function triggerShake(){setDoShakeNow(true);setTimeout(()=>setDoShakeNow(false),500);}
  function handleLogin(){
    setErr('');
    const emp=EMPLOYEES.find(e=>e.id===username.trim());
    if(!emp){setErr('ไม่พบรหัสพนักงานนี้ในระบบ');triggerShake();return;}
    const empId=emp.id;
    const record=authData[empId];
    const isFirstLogin=!record||!record.changed;
    if(isFirstLogin){
      // ครั้งแรก: password = ส่วนตัวเลขของ ID
      const defaultPw=getDefaultPassword(empId);
      if(password!==defaultPw){
        setErr(`รหัสผ่านไม่ถูกต้อง\n(ครั้งแรก: ใช้ตัวเลขจากรหัสพนักงาน)`);
        triggerShake();return;
      }
    } else {
      // เคยตั้งรหัสแล้ว: เปรียบ hash
      if(hashPin(password)!==record.hash){
        setErr('รหัสผ่านไม่ถูกต้อง');triggerShake();return;
      }
    }
    setLoading(true);
    setTimeout(()=>onLogin(emp,isFirstLogin),400);

/* ── Change Password Screen ── */
function ChangePasswordScreen({emp, onDone, gasUrl, onAuthUpdate}){
  const [step,setStep]=useState('new');
  const [newPin,setNewPin]=useState('');
  const [confirmPin,setConfirmPin]=useState('');
  const [doShakeNow,setDoShakeNow]=useState(false);
  const [err,setErr]=useState('');
  const [saving,setSaving]=useState(false);
  const current=step==='new'?newPin:confirmPin;
  const setCurrent=step==='new'?setNewPin:setConfirmPin;
  function triggerShake(){setDoShakeNow(true);setTimeout(()=>setDoShakeNow(false),500);}

  async function saveNewPassword(pin){
    setSaving(true);
    const hash=hashPin(pin);
    const record={hash,changed:true,updatedAt:new Date().toISOString()};
    // 1) อัป cache ในเครื่องก่อน (ใช้ได้ทันที)
    const cache=loadAuthCache();
    cache[emp.id]=record;
    saveAuthCache(cache);
    onAuthUpdate(emp.id,record);
    // 2) ส่งไป GAS Sheet (ถ้ามี URL)
    if(gasUrl){
      try{
        await fetch(gasUrl,{
          method:'POST',
          body:JSON.stringify({action:'set_password',employee_id:emp.id,hash,updatedAt:record.updatedAt})
        });
      }catch(e){/* network error — cache ยังใช้ได้ */}
    }
    setSaving(false);
    onDone();
  }

  function handleKey(k){
    if(saving)return;
    if(k==='del'){setCurrent(p=>p.slice(0,-1));return;}
    if(current.length>=6)return;
    const next=current+k;
    setCurrent(next);
    if(next.length===6){
      setTimeout(()=>{
        if(step==='new'){setStep('confirm');setErr('');}
        else{
          if(next!==newPin){setErr('รหัสผ่านไม่ตรงกัน ลองใหม่');setConfirmPin('');triggerShake();}
          else{saveNewPassword(next);}
        }
      },120);
    }
  }
  const dots=Array.from({length:6},(_,i)=>({filled:current.length>i}));
  const keys=['1','2','3','4','5','6','7','8','9','empty','0','del'];
  return(
    <div style={{position:'fixed',inset:0,zIndex:999,background:'rgba(12,100,120,0.5)',backdropFilter:'blur(8px)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Prompt',sans-serif"}}>
      <div style={{background:'#fff',borderRadius:24,padding:'32px 24px',width:'calc(100% - 40px)',maxWidth:380,boxShadow:'0 24px 60px rgba(12,100,120,0.25)',animation:'empUp .4s cubic-bezier(0.16,1,0.3,1)'}}>
        <div style={{width:60,height:60,borderRadius:18,background:'linear-gradient(135deg,var(--teal),var(--mid-teal))',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',fontSize:28,boxShadow:'0 6px 20px rgba(9,209,199,0.3)'}}>🔐</div>
        <div style={{textAlign:'center',fontSize:'1.2rem',fontWeight:700,color:'var(--txt)',marginBottom:4}}>ตั้งรหัสผ่านใหม่</div>
        <div style={{textAlign:'center',fontSize:'0.8rem',color:'var(--txt3)',marginBottom:20,fontFamily:"'Noto Sans Thai',sans-serif",lineHeight:1.6}}>
          {step==='new'?<>สวัสดีคุณ <strong>{emp.displayName}</strong><br/>กรุณาตั้งรหัสผ่านตัวเลข 6 หลักใหม่</>:<>กรุณากรอกรหัสผ่านอีกครั้ง<br/>เพื่อยืนยัน</>}
        </div>
        {saving&&<div style={{textAlign:'center',padding:'10px',color:'var(--teal)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:13,marginBottom:8}}>⏳ กำลังบันทึกรหัสผ่าน...</div>}
        {err&&<div style={{background:'#fff3f3',border:'1px solid #ffc8c8',borderRadius:10,padding:'8px 12px',color:'#cc3333',fontSize:'0.8rem',textAlign:'center',marginBottom:12,fontFamily:"'Noto Sans Thai',sans-serif"}}>{err}</div>}
        <div style={{textAlign:'center',fontSize:'0.72rem',fontWeight:600,color:'var(--txt3)',letterSpacing:'1px',textTransform:'uppercase',marginBottom:14,fontFamily:"'Noto Sans Thai',sans-serif"}}>{step==='new'?'กรอกรหัสผ่านใหม่':'ยืนยันรหัสผ่าน'}</div>
        <div style={{display:'flex',gap:10,justifyContent:'center',marginBottom:20}}>
          {dots.map((d,i)=>(
            <div key={i} style={{width:46,height:56,borderRadius:12,border:`2px solid ${d.filled?'var(--teal)':'var(--teal-border)'}`,background:d.filled?'var(--teal)':'var(--teal-dim)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.4rem',fontWeight:700,color:d.filled?'#fff':'var(--mid-teal)',transition:'0.15s',transform:d.filled?'scale(1.05)':'scale(1)',animation:doShakeNow?'shake 0.4s ease':undefined}}>
              {d.filled?'●':''}
            </div>
          ))}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,maxWidth:260,margin:'0 auto'}}>
          {keys.map((k,i)=>(
            k==='empty'?<div key={i}/>:
            <button key={i} onClick={()=>handleKey(k)} disabled={saving} style={{height:52,borderRadius:14,border:'1.5px solid var(--teal-border)',background:'var(--surface)',color:'var(--txt)',fontFamily:"'Space Mono',monospace",fontSize:'1.2rem',fontWeight:700,cursor:saving?'not-allowed':'pointer',display:'flex',alignItems:'center',justifyContent:'center',transition:'0.15s',opacity:saving?0.5:1}}>
              {k==='del'?<i className="ti ti-backspace"/>:k}
            </button>
          ))}
        </div>
        {/* Info note */}
        <div style={{marginTop:16,padding:'8px 12px',borderRadius:10,background:'var(--teal-dim)',border:'1px solid var(--teal-border)',fontSize:11,color:'var(--txt2)',fontFamily:"'Noto Sans Thai',sans-serif",lineHeight:1.5,textAlign:'center'}}>
          🔒 รหัสผ่านจะถูกเข้ารหัสก่อนบันทึก<br/>และซิงค์กับระบบอัตโนมัติ
        </div>
      </div>
    </div>
  );
}

/* ── CameraOverlay ── */
function CameraOverlay({onScan,onClose}){
  const videoRef=useRef(null),canvasRef=useRef(null),streamRef=useRef(null),rafRef=useRef(null);
  const [status,setStatus]=useState('กำลังเปิดกล้อง...');
  useEffect(()=>{
    let lastScan=0,active=true;
    async function start(){
      try{
        const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
        if(!active){stream.getTracks().forEach(t=>t.stop());return;}
        streamRef.current=stream;const video=videoRef.current;video.srcObject=stream;await video.play();
        setStatus('พร้อมสแกน ✓');scanLoop();
      }catch(err){setStatus('❌ ไม่สามารถเปิดกล้องได้');setTimeout(()=>onClose(),2000);}
    }
    function scanLoop(){
      const video=videoRef.current,canvas=canvasRef.current;
      if(!video||!canvas)return;const ctx=canvas.getContext('2d');
      function tick(){
        if(!active)return;
        if(video.readyState===video.HAVE_ENOUGH_DATA){
          canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0,canvas.width,canvas.height);
          const now=Date.now();
          if(now-lastScan>300){lastScan=now;try{const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);const code=window.jsQR&&window.jsQR(imgData.data,imgData.width,imgData.height,{inversionAttempts:'dontInvert'});if(code&&code.data){active=false;onScan(code.data.trim());return;}}catch(e){}}
        }
        rafRef.current=requestAnimationFrame(tick);
      }
      rafRef.current=requestAnimationFrame(tick);
    }
    start();
    return()=>{active=false;if(rafRef.current)cancelAnimationFrame(rafRef.current);if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());};
  },[]);
  return(
    <div style={{position:'fixed',inset:0,zIndex:100,background:'#000',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
      <video ref={videoRef} autoPlay playsInline muted style={{width:'100%',maxWidth:390,height:'100%',objectFit:'cover',position:'absolute',inset:0}}/>
      <canvas ref={canvasRef} style={{display:'none'}}/>
      <button onClick={onClose} style={{position:'absolute',top:48,right:16,zIndex:20,background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.3)',color:'#fff',borderRadius:'50%',width:44,height:44,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,cursor:'pointer',backdropFilter:'blur(10px)'}}>
        <i className="ti ti-x"/>
      </button>
      <div style={{position:'relative',zIndex:10,display:'flex',flexDirection:'column',alignItems:'center',gap:16,width:'100%'}}>
        <div style={{width:240,height:240,borderRadius:20,position:'relative',boxShadow:'0 0 0 2000px rgba(33,58,88,0.6)'}}>
          {[{top:0,left:0,borderWidth:'3px 0 0 3px',borderRadius:'10px 0 0 0'},{top:0,right:0,borderWidth:'3px 3px 0 0',borderRadius:'0 10px 0 0'},{bottom:0,left:0,borderWidth:'0 0 3px 3px',borderRadius:'0 0 0 10px'},{bottom:0,right:0,borderWidth:'0 3px 3px 0',borderRadius:'0 0 10px 0'}].map((s,i)=><div key={i} style={{position:'absolute',width:44,height:44,borderColor:'var(--teal)',borderStyle:'solid',...s}}/>)}
          <div style={{position:'absolute',left:4,right:4,height:2,background:'linear-gradient(90deg, transparent, var(--teal), transparent)',animation:'scanLine 2s ease-in-out infinite'}}/>
        </div>
        <div style={{color:'rgba(255,255,255,0.7)',fontSize:13,textAlign:'center'}}>วาง QR Code ให้อยู่ในกรอบ</div>
        <div style={{color:'#fff',fontFamily:"'Space Mono',monospace",fontSize:11,textAlign:'center',minHeight:16}}>{status}</div>
      </div>
      <button onClick={()=>{onClose();setTimeout(()=>document.getElementById('manual-input')?.focus(),200);}} style={{position:'absolute',bottom:100,left:'50%',transform:'translateX(-50%)',zIndex:20,background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.3)',color:'#fff',borderRadius:100,padding:'10px 24px',fontSize:13,fontFamily:"'Noto Sans Thai',sans-serif",cursor:'pointer',backdropFilter:'blur(10px)',whiteSpace:'nowrap'}}>⌨ พิมพ์รหัสแทน</button>
    </div>
  );
}

function StatCard({icon,value,label,accent,dimBg,borderColor}){

    <div style={{background:dimBg,border:`1.5px solid ${borderColor}`,borderRadius:20,padding:'18px 16px',boxShadow:'0 2px 8px rgba(33,58,88,0.06)'}}>
      <i className={`ti ${icon}`} style={{fontSize:20,color:accent,marginBottom:8,display:'block'}}/>
      <div style={{fontFamily:"'Outfit',sans-serif",fontSize:32,fontWeight:800,lineHeight:1,letterSpacing:'-1.5px',color:accent}}>{value}</div>
      <div style={{fontSize:11,marginTop:5,fontWeight:600,color:accent,opacity:0.8}}>{label}</div>
    </div>
  );
}
function PageHome({items,logs,onGoScan}){
  const now=new Date(),ws=new Date(now);
  ws.setDate(now.getDate()-now.getDay());ws.setHours(0,0,0,0);
  const wl=logs.filter(l=>{const d=parseTs(l.timestamp);return d&&d>=ws;});
  const tl=logs.filter(l=>{const d=parseTs(l.timestamp);return d&&d.toDateString()===now.toDateString();});
  const lo=items.filter(x=>x.stock<=x.min);
  const lastTs=logs.length?parseTs(logs[0].timestamp):null;
  const recent=logs.slice(0,4);
  const Card=({children})=><div style={{background:'var(--surface)',border:'1px solid var(--teal-border)',borderRadius:20,padding:'4px 16px',boxShadow:'var(--shadow-sm)'}}>{children}</div>;
  const Eyebrow=({children})=><div style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:'var(--txt3)',letterSpacing:'1.6px',textTransform:'uppercase',marginBottom:8,marginTop:20}}>{children}</div>;
  return(
    <div className="page-cinematic">
      <div className="cin-hero-card" style={{background:'linear-gradient(135deg, #0C6478 0%, #213A58 100%)',borderRadius:28,padding:22,marginTop:14,marginBottom:4,position:'relative',overflow:'hidden',boxShadow:'0 8px 32px rgba(33,58,88,0.22)'}}>
        <div style={{position:'absolute',top:-40,right:-40,width:160,height:160,borderRadius:'50%',background:'rgba(255,255,255,0.04)'}}/>
        <div style={{fontSize:10,color:'rgba(255,255,255,0.45)',fontFamily:"'Space Mono',monospace",letterSpacing:'1.5px',textTransform:'uppercase',marginBottom:6}}>สัปดาห์นี้</div>
        <div style={{display:'flex',alignItems:'baseline',gap:10}}>
          <div style={{fontFamily:"'Outfit',sans-serif",fontSize:58,fontWeight:800,lineHeight:1,letterSpacing:'-3px',color:'#fff'}}>{wl.length}</div>
          <div>
            <div style={{fontSize:13,color:'rgba(255,255,255,0.6)',fontWeight:600}}>ครั้งที่เบิก</div>
            <div style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:'rgba(255,255,255,0.3)'}}>{lastTs?lastTs.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):'—'}</div>
          </div>
        </div>
        <button onClick={onGoScan} style={{marginTop:16,width:'100%',padding:11,borderRadius:14,border:'1px solid rgba(255,255,255,0.15)',background:'rgba(255,255,255,0.09)',color:'#fff',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:13,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          <i className="ti ti-qrcode" style={{fontSize:15}}/> เบิกอุปกรณ์เลย
        </button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:12}}>
        <div className="cin-stat-1"><StatCard icon="ti-package" value={items.length} label="รายการอุปกรณ์" accent="var(--teal)" dimBg="var(--teal-dim)" borderColor="var(--teal-border)"/></div>
        <div className="cin-stat-2"><StatCard icon="ti-clipboard-list" value={tl.length} label="เบิกวันนี้" accent="var(--mint)" dimBg="var(--mint-dim)" borderColor="var(--mint-border)"/></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:10}}>
        <div className="cin-stat-3"><StatCard icon="ti-qrcode" value={items.length} label="QR ที่ออกแล้ว" accent="var(--mid-teal)" dimBg="#E8F3F5" borderColor="#A0CDD5"/></div>
        <div className="cin-stat-4"><StatCard icon="ti-alert-triangle" value={lo.length} label="สต๊อกใกล้หมด" accent={lo.length>0?'#CC6A00':'var(--mid-teal)'} dimBg={lo.length>0?'#FFF4EC':'#E8F3F5'} borderColor={lo.length>0?'#FFC899':'#A0CDD5'}/></div>
      </div>
      <Eyebrow>เบิกล่าสุด</Eyebrow>
      <Card>{recent.length?recent.map((l,i)=><LogRow key={i} l={l} items={items} showTime={false} isLast={i===recent.length-1}/>):<div style={{color:'var(--txt3)',fontSize:12,textAlign:'center',padding:16}}>ยังไม่มีรายการ</div>}</Card>
      <Eyebrow>สต๊อกใกล้หมด</Eyebrow>
      <Card>
        {lo.length?lo.map((it,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:i<lo.length-1?'1px solid var(--teal-border)':'none'}}>
            <div style={{width:40,height:40,borderRadius:12,background:'#FFF4EC',border:'1px solid #FFC899',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>{it.icon}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:700,color:'var(--txt)'}}>{it.name}</div>
              <div style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:'var(--txt3)'}}>{it.cat}</div>
            </div>
            <span style={{display:'inline-flex',alignItems:'center',padding:'4px 10px',borderRadius:100,fontSize:11,fontWeight:600,background:'#FFF4EC',color:'#CC6A00',border:'1px solid #FFC899'}}>{it.stock} {it.unit}</span>
          </div>
        )):<div style={{color:'var(--txt3)',fontSize:12,textAlign:'center',padding:16}}>สต๊อกปกติทั้งหมด ✓</div>}
      </Card>
    </div>
  );
}

/* ── ItemActionPanel (with EmployeePicker & Lock on Restock) ── */

  const LS={fontSize:12,color:'var(--txt2)',display:'block',marginBottom:6,marginTop:14,fontWeight:500};

        <div style={{fontFamily:"'Space Mono',monospace",fontSize:11,color:'var(--txt3)',marginTop:2}}>{curItem.id}</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',margin:'10px 0'}}>

          <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'4px 10px',borderRadius:100,fontSize:11,fontWeight:600,background:isLow?'#FFF4EC':'var(--mint-dim)',color:isLow?'#CC6A00':'var(--mid-teal)',border:`1px solid ${isLow?'#FFC899':'var(--mint-border)'}`}}>{isLow?'สต๊อกใกล้หมด':'สต๊อกปกติ'}</span>
        </div>
        <div style={{display:'flex',alignItems:'baseline',gap:8,margin:'4px 0 0'}}>
          <div style={{fontFamily:"'Outfit',sans-serif",fontSize:40,fontWeight:800,color:isLow?'#CC6A00':'var(--teal)',letterSpacing:'-1.5px'}}>{curItem.stock}</div>
          <div style={{fontSize:13,color:'var(--txt2)'}}>{curItem.unit}</div>
          <div style={{fontSize:11,color:'var(--txt3)'}}>คงเหลือ</div>
        </div>
      </div>
      {/* Mode tabs */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,margin:'10px 0'}}>
        {Object.entries(MC).map(([key,m2])=>(
          <button key={key} onClick={()=>setMode(key)} style={{padding:'9px 4px',borderRadius:14,border:`1.5px solid ${mode===key?m2.color:'var(--teal-border)'}`,background:mode===key?m2.grad:'var(--surface)',color:mode===key?'#fff':'var(--txt2)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:12,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:4,transition:'.2s',boxShadow:mode===key?m2.shadow:'var(--shadow-sm)'}}>

          <div style={{fontSize:42,marginBottom:12}}>🔒</div>
          <div style={{fontSize:16,fontWeight:700,color:'var(--txt)',marginBottom:8}}>โหมดเติม Stock ถูกล็อค</div>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>

            <div><label style={LS}>หน่วย</label><input value={curItem.unit} readOnly style={{...IS,opacity:0.5}}/></div>
          </div>
          <label style={LS}>หมายเหตุ</label>

          <button onClick={handleConfirm} style={{width:'100%',padding:15,borderRadius:20,border:'none',background:mc.grad,color:'#fff',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:15,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,boxShadow:mc.shadow,marginTop:14}}>
            <i className={`ti ${mc.icon}`} style={{fontSize:18}}/> {mc.btnLabel}

      <button onClick={onCancel} style={{width:'100%',padding:13,borderRadius:20,border:'1.5px solid var(--teal-border)',background:'var(--surface)',color:'var(--txt2)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:15,fontWeight:600,cursor:'pointer',marginTop:8}}>ยกเลิก</button>
    </div>
  );
}

/* ── PageScan ── */
function PageScan({items,curItem,onScan,onConfirm,onCancel,onOpenCamera,loggedInEmp,setupUnlocked,onUnlockRestock}){
  const [manualCode,setManualCode]=useState('');
  const [nameSearch,setNameSearch]=useState('');
  const [searchResults,setSearchResults]=useState([]);
  useEffect(()=>{if(!nameSearch.trim()){setSearchResults([]);return;}setSearchResults(items.filter(it=>fuzzyMatch(it.name,nameSearch)||fuzzyMatch(it.cat,nameSearch)));},[nameSearch,items]);
  const IS={background:'var(--surface)',border:'1.5px solid var(--teal-border)',borderRadius:14,color:'var(--txt)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:14,padding:'13px 14px',width:'100%',outline:'none',boxShadow:'var(--shadow-sm)'};
  
  if(curItem)return <ItemActionPanel curItem={curItem} onConfirm={onConfirm} onCancel={onCancel} loggedInEmp={loggedInEmp} setupUnlocked={setupUnlocked} onUnlock={onUnlockRestock}/>;
  
  return(
    <div className="page-cinematic">
      <div className="cin-scan-area" onClick={onOpenCamera} style={{margin:'20px 0 16px',textAlign:'center',padding:'36px 20px',background:'var(--teal-dim)',border:'2px dashed var(--teal-border)',borderRadius:28,cursor:'pointer'}}>
        <i className="ti ti-camera" style={{fontSize:48,color:'var(--teal)',display:'block',marginBottom:10}}/>
        <div style={{fontFamily:"'Outfit',sans-serif",fontSize:22,fontWeight:800,color:'var(--navy)',letterSpacing:'-0.5px'}}>แตะเพื่อเปิดกล้อง</div>
        <div style={{fontSize:12,color:'var(--txt3)',marginTop:4}}>สแกน QR Code ด้วยกล้องโทรศัพท์</div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:10,margin:'4px 0 12px'}}>
        <div style={{flex:1,height:1,background:'var(--teal-border)'}}/><span style={{fontSize:11,color:'var(--txt3)'}}>หรือค้นหา</span><div style={{flex:1,height:1,background:'var(--teal-border)'}}/>
      </div>
      <div style={{position:'relative',marginBottom:10}}>
        <i className="ti ti-search" style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',fontSize:16,color:'var(--txt3)',pointerEvents:'none'}}/>
        <input value={nameSearch} onChange={e=>setNameSearch(e.target.value)} placeholder="ค้นหาชื่ออุปกรณ์ เช่น กระดาษ, ปากกา..." style={{...IS,paddingLeft:40}}/>
      </div>
      {nameSearch.trim()&&(
        <div style={{background:'var(--surface)',border:'1px solid var(--teal-border)',borderRadius:20,padding:'4px 16px',marginBottom:12,boxShadow:'var(--shadow-sm)',animation:'slideDown .2s ease'}}>
          {searchResults.length===0?<div style={{padding:'16px 0',textAlign:'center',color:'var(--txt3)',fontSize:13}}>ไม่พบอุปกรณ์ที่ตรงกัน</div>
            :searchResults.map((it,i)=>(
              <div key={it.id} onClick={()=>onScan(it.id)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:i<searchResults.length-1?'1px solid var(--teal-border)':'none',cursor:'pointer'}}>
                <div style={{width:40,height:40,borderRadius:12,background:'var(--teal-dim)',border:'1px solid var(--teal-border)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>{it.icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13,color:'var(--txt)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.name}</div>
                  <div style={{fontSize:11,color:'var(--txt2)'}}>{it.cat} · {it.stock} {it.unit}</div>
                </div>
                <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:3}}>
                  <span style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:'var(--txt3)'}}>{it.id}</span>
                  <span style={{display:'inline-flex',padding:'2px 8px',borderRadius:100,fontSize:10,fontWeight:600,background:it.stock<=it.min?'#FFF4EC':'var(--teal-dim)',color:it.stock<=it.min?'#CC6A00':'var(--mid-teal)',border:`1px solid ${it.stock<=it.min?'#FFC899':'var(--teal-border)'}`}}>{it.stock<=it.min?'ใกล้หมด':'ปกติ'}</span>
                </div>
              </div>
            ))
          }
        </div>
      )}
      <div style={{display:'flex',gap:8,marginBottom:10}}>
        <input id="manual-input" value={manualCode} onChange={e=>setManualCode(e.target.value)} onKeyDown={e=>e.key==='Enter'&&onScan(manualCode.trim())} placeholder="พิมพ์รหัส QR เช่น QR-PAPER1" style={{...IS,flex:1}}/>
        <button onClick={()=>{if(manualCode.trim())onScan(manualCode.trim());}} style={{padding:'13px 16px',borderRadius:14,border:'1.5px solid var(--teal-border)',background:'var(--surface)',color:'var(--txt2)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:13,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>ค้นหา</button>
      </div>
      {items.slice(0,6).length>0&&(
        <div style={{marginTop:12}}>
          <div style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:'var(--txt3)',letterSpacing:'1.6px',textTransform:'uppercase',marginBottom:8}}>QR ตัวอย่าง (แตะทดสอบ)</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {items.slice(0,6).map(it=><div key={it.id} onClick={()=>onScan(it.id)} style={{padding:'6px 12px',borderRadius:100,background:'var(--surface)',border:'1.5px solid var(--teal-border)',fontFamily:"'Space Mono',monospace",fontSize:11,color:'var(--teal)',cursor:'pointer',boxShadow:'var(--shadow-sm)'}}>{it.icon} {it.id}</div>)}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── PageLog ── */
function PageLog({logs,items,onSync}){
  const [search,setSearch]=useState('');
  const [fw,setFw]=useState('week');
  const [showDebug,setShowDebug]=useState(false);
  const now=new Date(),ws=new Date(now);
  ws.setDate(now.getDate()-now.getDay());ws.setHours(0,0,0,0);
  const filtered=logs.filter(l=>{
    const q=search.toLowerCase();
    const empObj=EMPLOYEES.find(e=>l.employee&&(e.id===l.employee||e.name===l.employee));
    const m=!q||(l.item_name||'').toLowerCase().includes(q)||(l.employee||'').toLowerCase().includes(q)||(l.qr_id||'').toLowerCase().includes(q)||(empObj&&empObj.name.toLowerCase().includes(q));
    if(!m)return false;if(fw==='all')return true;
    const d=parseTs(l.timestamp);if(!d)return false;
    if(fw==='today')return d.toDateString()===now.toDateString();
    if(fw==='week')return d>=ws;
    if(fw==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    return true;
  });
  const totalQty=filtered.reduce((s,l)=>s+(Number(l.quantity)||0),0);
  const uniqueEmp=new Set(filtered.map(l=>l.employee).filter(Boolean)).size;
  const uniqueItem=new Set(filtered.map(l=>l.item_name).filter(Boolean)).size;
  const SS={background:'var(--surface)',border:'1.5px solid var(--teal-border)',borderRadius:14,color:'var(--txt)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:13,padding:'10px 12px',width:'100%',outline:'none',boxShadow:'var(--shadow-sm)',WebkitAppearance:'none'};
  const IS={background:'var(--surface)',border:'1.5px solid var(--teal-border)',borderRadius:14,color:'var(--txt)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:14,padding:'13px 14px',width:'100%',outline:'none',boxShadow:'var(--shadow-sm)',marginBottom:10};
  const Pill=({children,color,bg,border})=><span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'4px 10px',borderRadius:100,fontSize:11,fontWeight:600,background:bg,color,border:`1px solid ${border}`}}>{children}</span>;
  return(
    <div className="page-cinematic">
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:14,marginBottom:10}}>
        <select value={fw} onChange={e=>setFw(e.target.value)} style={SS}><option value="all">ทุกช่วงเวลา</option><option value="today">วันนี้</option><option value="week">สัปดาห์นี้</option><option value="month">เดือนนี้</option></select>

  const [needChangePw,setNeedChangePw]=useState(false);
  // authData: { [empId]: { hash, changed, updatedAt } }
  const [authData,setAuthData]=useState(()=>loadAuthCache());
  const [items,setItems]=useState(()=>normalizeItems(loadLocal('ss2_items',[])));

  const [cfg,setCfg]=useState(()=>{const c=loadLocal('ss2_cfg',{});if(DEFAULT_GAS_URL)c.url=DEFAULT_GAS_URL;else if(!c.url)c.url='';return c;});
  const [activePage,setActivePage]=useState('home');
  const [curItem,setCurItem]=useState(null);
  const [setupUnlocked,setSetupUnlocked]=useState(false);

  useEffect(()=>{saveAuthCache(authData);},[authData]);

  useEffect(()=>{localStorage.setItem('ss2_logs',JSON.stringify(logs));},[logs]);
  useEffect(()=>{localStorage.setItem('ss2_cfg',JSON.stringify(cfg));},[cfg]);

// เผื่อไว้ให้ซิงค์อีกครั้งตอนผู้ใช้ล็อคอินเสร็จ
useEffect(()=>{ if(loggedInEmp) syncData(); }, [loggedInEmp]);

  // callback from ChangePasswordScreen to update local authData

  // syncFailed = sync ล้มเหลวและยังไม่เคย sync สำเร็จเลย (เครื่องใหม่ / ไม่มีแคช)
  // ถ้า sync ล้มเหลวแต่มีแคชใน localStorage → ให้ข้ามไปหน้า Login ได้เลย (offline mode)
  const hasCachedAuth = Object.keys(authData).length > 0;
  if(!loggedInEmp){
    if(!authSynced){
      // ถ้า sync fail แต่มี auth cache อยู่ → ไม่ต้องรอ ไปหน้า Login เลย

      } else {

            {syncFailed ? (

                <button onClick={()=>{setSyncFailed(false);syncData();}} style={{
                  padding:'13px 32px',borderRadius:14,border:'none',
                  background:'linear-gradient(135deg,rgba(255,255,255,0.95),rgba(220,248,246,0.95))',
                  color:'#0C5060',fontFamily:"'Prompt',sans-serif",fontWeight:700,fontSize:'1rem',
                  cursor:'pointer',boxShadow:'0 8px 24px rgba(0,0,0,0.2)',

              </div>

              <div style={{zIndex:5,textAlign:'center',color:'#fff'}}>

  function handleLogout(){if(!window.confirm('ต้องการออกจากระบบ?'))return;if(window.closeApp)window.closeApp();}

  async function fetchViaFetch(url){const res=await fetch(url+(url.includes('?')?'&':'?')+'_t='+Date.now(),{method:'GET',redirect:'follow',mode:'cors'});const text=await res.text();const clean=text.trim();if(clean.startsWith('{')||clean.startsWith('['))return JSON.parse(clean);const m=clean.match(/^[^(]+\((.+)\)\s*;?\s*$/s);if(m)return JSON.parse(m[1]);throw new Error('Unexpected response');}
  function fetchViaJsonp(url){return new Promise((resolve,reject)=>{const cbName='_gs_'+Date.now()+'_'+Math.floor(Math.random()*99999);const script=document.createElement('script');let settled=false;const finish=fn=>{if(settled)return;settled=true;clearTimeout(timer);delete window[cbName];if(script.parentNode)script.parentNode.removeChild(script);fn();};const timer=setTimeout(()=>finish(()=>reject(new Error('timeout'))),25000);window[cbName]=data=>finish(()=>resolve(data));script.src=url+(url.includes('?')?'&':'?')+'callback='+cbName+'&_t='+Date.now();script.onerror=()=>finish(()=>reject(new Error('blocked')));document.head.appendChild(script);});}
  async function gasPost(url,body){const res=await fetch(url,{method:'POST',body:JSON.stringify(body)});try{return JSON.parse(await res.text());}catch(e){return{status:'ok'};}}

  function applyResponseData(data){if(!data||!Array.isArray(data.items))throw new Error('No items');setItems(normalizeItems(data.items));setLogs(normalizeLogs(data.logs||[]));}

  async function syncData(){

      setSyncStatus('ok');ok=true;
    }catch(e1){try{const d=await fetchViaJsonp(cfg.url);applyResponseData(d);
      if(d.auth&&typeof d.auth==='object'){
        setAuthData(prev=>{const merged={...prev,...d.auth};saveAuthCache(merged);return merged;});

      setSyncStatus('ok');ok=true;}catch(e2){}}

  );
}

/* ── Cinematic Engine ── */
(function CinematicEngine(){
  const EASE = 'cubic-bezier(0.16,1,0.3,1)';
  let lastKey = '';
  function retrig(el){ el.style.animationName='none'; void el.offsetHeight; el.style.animationName=''; }
  function staggerIn(els, step, start){
    els.forEach((el,i)=>{
      if(el.dataset.cin) return;
      el.dataset.cin='1';
      el.style.opacity='0';
      el.style.transform='translateY(22px) scale(0.94)';
      setTimeout(()=>{
        el.style.transition=`opacity 0.44s ${EASE}, transform 0.44s ${EASE}`;
        el.style.opacity='1';
        el.style.transform='translateY(0) scale(1)';
      }, start + i*step);
    });
  }
  const obs = new MutationObserver(()=>{
    const root = document.getElementById('root');
    if(!root) return;
    const pages = root.querySelectorAll('.page-cinematic');
    const key = pages.length + (pages[0] ? pages[0].children.length : 0) + root.querySelector('[class*="page-"]')?.className;
    if(key !== lastKey){
      lastKey = key;
      pages.forEach(p => retrig(p));
      setTimeout(()=>{
        pages.forEach(p=>{
          const directCards = Array.from(p.children).filter(el=>{
            const s = el.getAttribute('style')||'';
            return s.includes('borderRadius:28') || s.includes('borderRadius:20');
          });
          staggerIn(directCards, 70, 100);
          p.querySelectorAll('.cin-stat-1,.cin-stat-2,.cin-stat-3,.cin-stat-4').forEach((card,ci)=>{
            if(card.dataset.popped) return;
            card.dataset.popped='1';
            const num = card.querySelector('div');
            if(num){ setTimeout(()=>{ num.style.transition='transform 0.38s cubic-bezier(0.34,1.56,0.64,1)'; num.style.transform='scale(1.28)'; setTimeout(()=>num.style.transform='scale(1)',190); }, 160+ci*110); }
          });
        });
      }, 55);
    }
    const empGrid = root.querySelector('.emp-grid-list');
    if(empGrid){ staggerIn(Array.from(empGrid.querySelectorAll('.emp-grid-card:not([data-cin])')), 32, 35); }
  });
  obs.observe(document.body, { childList:true, subtree:true });
})();

/* ── Helpers ── */
function loadLocal(key,fb){try{return JSON.parse(localStorage.getItem(key))||fb;}catch(e){return fb;}}
function normalizeItems(arr){if(!Array.isArray(arr))return[];return arr.map(it=>({id:String(it.id||it.ID||'').trim(),name:String(it.name||it.Name||'').trim(),cat:String(it.cat||it.category||it.Category||'').trim(),stock:Number(String(it.stock??it.Stock??0).replace(/[^0-9.]/g,''))||0,unit:String(it.unit||it.Unit||'อัน').trim(),min:Number(String(it.min??it.Min??0).replace(/[^0-9.]/g,''))||0,icon:String(it.icon||it.Icon||'📦').trim(),img:String(it.img||it.Img||it.image||it.Image||'').trim()})).filter(it=>it.id);}
function getDefaultPassword(empId){return empId.replace(/[A-Za-z]/g,'');}
function hashPin(pin){let h=2166136261;for(let i=0;i<pin.length;i++){h^=pin.charCodeAt(i);h=(h*16777619)>>>0;}return h.toString(16).padStart(8,'0');}
function loadAuthCache(){try{return JSON.parse(localStorage.getItem('ss2_auth_v3'))||{};}catch(e){return{};}}
function saveAuthCache(data){try{localStorage.setItem('ss2_auth_v3',JSON.stringify(data));}catch(e){}}

  const [loading,setLoading]=useState(false);

    setErr('');
    const emp=AA_EMPLOYEES.find(e=>e.id===username.trim());
    if(!emp){setErr('ไม่พบรหัสพนักงานนี้ในระบบ');triggerShake();return;}
    const record=authData[emp.id];
    const isFirst=!record||!record.changed;

    else{if(hashPin(password)!==record.hash){setErr('รหัสผ่านไม่ถูกต้อง');triggerShake();return;}}
    if(!AUDIT_ALLOWED.includes(emp.id)){setErr('คุณไม่ได้รับสิทธิ์เข้าใช้งาน Asset Audit');triggerShake();return;}

  return(
    <div className="cin-wrap">
      <div className="cin-bg"><div className="cin-bg-grad"/><div className="cin-orb cin-orb-1"/><div className="cin-orb cin-orb-2"/><AA_CinParticles/><div className="cin-vignette"/></div>

          </div>
          <div className="cin-title" style={{color:'#fff',fontSize:'1.75rem',fontWeight:800,letterSpacing:'1.5px',textShadow:'0 2px 12px rgba(0,0,0,0.3)',fontFamily:"'Outfit',sans-serif"}}>Asset Audit</div>
          <div className="cin-subtitle" style={{color:'rgba(255,255,255,0.65)',fontSize:'0.76rem',marginTop:5,fontFamily:"'Noto Sans Thai',sans-serif",letterSpacing:'1px'}}>ตรวจนับทรัพย์สิน · IDC-3</div>
        </div>
        {err&&<div style={{background:'rgba(255,77,77,0.15)',border:'1px solid rgba(255,100,100,0.35)',borderRadius:12,padding:'10px 14px',color:'#fff',fontSize:'0.82rem',fontFamily:"'Noto Sans Thai',sans-serif",marginBottom:16,textAlign:'center',animation:'fadeUp 0.2s ease'}}>⚠ {err}</div>}

/* ── AA_CameraOverlay ── */
function AA_CameraOverlay({onScan,onClose}){
  const videoRef=useRef(null),canvasRef=useRef(null),streamRef=useRef(null),rafRef=useRef(null);
  const [status,setStatus]=useState('กำลังเปิดกล้อง...');
  useEffect(()=>{
    let lastScan=0,active=true;
    async function start(){
      try{
        const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
        if(!active){stream.getTracks().forEach(t=>t.stop());return;}
        streamRef.current=stream;const video=videoRef.current;video.srcObject=stream;await video.play();
        setStatus('พร้อมสแกน ✓');scanLoop();
      }catch(err){setStatus('❌ ไม่สามารถเปิดกล้องได้');setTimeout(()=>onClose(),2000);}
    }
    function scanLoop(){
      const video=videoRef.current,canvas=canvasRef.current;
      if(!video||!canvas)return;const ctx=canvas.getContext('2d');
      function tick(){
        if(!active)return;
        if(video.readyState===video.HAVE_ENOUGH_DATA){
          canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0,canvas.width,canvas.height);
          const now=Date.now();
          if(now-lastScan>300){lastScan=now;try{const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);const code=window.jsQR&&window.jsQR(imgData.data,imgData.width,imgData.height,{inversionAttempts:'dontInvert'});if(code&&code.data){active=false;onScan(code.data.trim());return;}}catch(e){}}
        }
        rafRef.current=requestAnimationFrame(tick);
      }
      rafRef.current=requestAnimationFrame(tick);
    }
    start();
    return()=>{active=false;if(rafRef.current)cancelAnimationFrame(rafRef.current);if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());};
  },[]);
  return(
    <div style={{position:'fixed',inset:0,zIndex:100,background:'#000',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
      <video ref={videoRef} autoPlay playsInline muted style={{width:'100%',maxWidth:390,height:'100%',objectFit:'cover',position:'absolute',inset:0}}/>
      <canvas ref={canvasRef} style={{display:'none'}}/>
      <button onClick={onClose} style={{position:'absolute',top:48,right:16,zIndex:20,background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.3)',color:'#fff',borderRadius:'50%',width:44,height:44,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,cursor:'pointer',backdropFilter:'blur(10px)'}}>
        <i className="ti ti-x"/>
      </button>

/* ── AssetThumb ── */
function AssetThumb({item,size=56,radius=13,condBg,condBorder}){
  const EXT=['jpg','jpeg','png','webp','gif'];
  const [tryIdx,setTryIdx]=useState(0);
  const [failed,setFailed]=useState(false);
  // ถ้ามี item.img ให้ใช้ก่อน ไม่งั้นใช้ item.id + extension
  const buildSrc=(idx)=>{
    if(item.img)return `assetimages/${item.img}`;
    if(idx>=EXT.length)return null;
    return `assetimages/${item.id}.${EXT[idx]}`;
  };
  const src=buildSrc(tryIdx);
  function handleError(){
    if(item.img){setFailed(true);return;}
    const next=tryIdx+1;
    if(next>=EXT.length)setFailed(true);
    else setTryIdx(next);
  }
  const bg=condBg||'var(--surface2)';
  const border=condBorder||'var(--teal-border)';
  return(
    <div style={{width:size,height:size,borderRadius:radius,background:bg,border:`1.5px solid ${border}`,overflow:'hidden',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*0.4,transition:'.2s',position:'relative',boxShadow:'0 2px 8px rgba(33,58,88,0.08)'}}>
      {src&&!failed
        ?<img src={src} alt={item.name} onError={handleError} style={{width:'100%',height:'100%',objectFit:'cover',objectPosition:'center top',display:'block'}}/>
        :<span style={{userSelect:'none'}}>{item.icon||'📦'}</span>
      }
    </div>
  );
}

  const [isSaving,setIsSaving]=useState(false);

  function handleAssetSaved(newItem){setItems(prev=>[...prev,newItem]);}
  const now=new Date();

  async function fetchViaFetch(url){const res=await fetch(url+(url.includes('?')?'&':'?')+'_t='+Date.now(),{method:'GET',redirect:'follow',mode:'cors'});const text=await res.text();const clean=text.trim();if(clean.startsWith('{')||clean.startsWith('['))return JSON.parse(clean);const m=clean.match(/^[^(]+\((.+)\)\s*;?\s*$/s);if(m)return JSON.parse(m[1]);throw new Error('Unexpected response');}
  function fetchViaJsonp(url){return new Promise((resolve,reject)=>{const cbName='_gs_'+Date.now()+'_'+Math.floor(Math.random()*99999);const script=document.createElement('script');let settled=false;const finish=fn=>{if(settled)return;settled=true;clearTimeout(timer);delete window[cbName];if(script.parentNode)script.parentNode.removeChild(script);fn();};const timer=setTimeout(()=>finish(()=>reject(new Error('timeout'))),25000);window[cbName]=data=>finish(()=>resolve(data));script.src=url+(url.includes('?')?'&':'?')+'callback='+cbName+'&_t='+Date.now();script.onerror=()=>finish(()=>reject(new Error('blocked')));document.head.appendChild(script);});}

  async function syncData(){
    if(!cfg.url){setSyncStatus('none');return;}if(isSyncing)return;
