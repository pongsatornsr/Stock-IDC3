    try{
      const d=await fetchViaFetch(cfg.url);
      if(d&&Array.isArray(d.items))setItems(normalizeItems(d.items));
      if(d.auth&&typeof d.auth==='object'){setAuthData(prev=>{const merged={...prev,...d.auth};saveAuthCache(merged);return merged;});}
      setSyncStatus('ok');ok=true;
    }catch(e1){
      try{
        const d=await fetchViaJsonp(cfg.url);
        if(d&&Array.isArray(d.items))setItems(normalizeItems(d.items));
        if(d.auth&&typeof d.auth==='object'){setAuthData(prev=>{const merged={...prev,...d.auth};saveAuthCache(merged);return merged;});}
        setSyncStatus('ok');ok=true;
      }catch(e2){}
    }
    if(!ok){setSyncStatus('error');if(!authSynced)setSyncFailed(true);}
    else{setSyncFailed(false);setAuthSynced(true);}
    setIsSyncing(false);
  }

  function handleLogout(){if(!window.confirm('ต้องการออกจากระบบ?'))return;if(window.closeApp)window.closeApp();}

  /* ── Auth guard ── */
  const hasCachedAuth=Object.keys(authData).length>0;
  if(!loggedInEmp){
    if(!authSynced&&!(syncFailed&&hasCachedAuth)){
      return(
        <div className="cin-wrap">
          <div className="cin-bg"><div className="cin-bg-grad"/><div className="cin-orb cin-orb-1"/><div className="cin-orb cin-orb-2"/><AA_CinParticles/><div className="cin-vignette"/></div>
          {syncFailed?(
            <div style={{zIndex:5,textAlign:'center',color:'#fff',padding:'0 32px'}}>
              <div style={{fontSize:44,marginBottom:14}}>⚠️</div>
              <div style={{fontFamily:"'Outfit',sans-serif",fontSize:'1.3rem',fontWeight:800,marginBottom:8}}>เชื่อมต่อไม่ได้</div>
              <div style={{color:'rgba(255,255,255,0.65)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'0.85rem',marginBottom:24,lineHeight:1.6}}>ไม่สามารถดึงข้อมูลจาก Server ได้</div>
              <button onClick={()=>{setSyncFailed(false);syncData();}} style={{padding:'13px 32px',borderRadius:14,border:'none',background:'linear-gradient(135deg,rgba(255,255,255,0.95),rgba(220,248,246,0.95))',color:'#0C5060',fontFamily:"'Prompt',sans-serif",fontWeight:700,fontSize:'1rem',cursor:'pointer'}}>🔄 ลองใหม่</button>
            </div>
          ):(
            <div style={{zIndex:5,textAlign:'center',color:'#fff'}}>
              <div style={{fontSize:40,marginBottom:16}}>🔍</div>
              <div style={{fontFamily:"'Outfit',sans-serif",fontSize:'1.4rem',fontWeight:800,letterSpacing:'1.5px',marginBottom:10}}>Asset Audit</div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,color:'rgba(255,255,255,0.7)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'0.9rem'}}>
                <span style={{display:'inline-block',width:16,height:16,border:'2px solid rgba(9,209,199,0.8)',borderTopColor:'transparent',borderRadius:'50%',animation:'scanLine 0.8s linear infinite'}}/>
                กำลังโหลดข้อมูล...
              </div>
            </div>
          )}
        </div>
      );
    }
    return <AA_LoginScreen authData={authData} isSyncing={isSyncing} onLogin={(emp)=>setLoggedInEmp(emp)}/>;
  }

  /* ── Audit logic ── */
  const total=items.length;
  const checked=scannedIds.filter(id=>auditData[id]?.condition).length;
  const pct=total>0?Math.round(checked/total*100):0;
  const issues=scannedIds.filter(id=>auditData[id]?.condition&&auditData[id].condition!=='normal');
  const normalItems=scannedIds.filter(id=>auditData[id]?.condition==='normal');

  function handleScan(code){
    const trimmed=code.trim();if(!trimmed)return;
    const item=items.find(it=>it.id===trimmed);
    if(!item){showToast('ไม่พบทรัพย์สินนี้ในระบบ ❌','#FF4D4D');setScanCode('');return;}
    if(!scannedIds.includes(trimmed)){setScannedIds(prev=>[trimmed,...prev]);}
    showToast(`📋 "${item.name}" — เลือกสภาพด้วย`,'var(--navy)');
    setScanCode('');
    setTimeout(()=>{const el=document.getElementById('audit-item-'+trimmed);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},200);
  }
  function setCondition(id,val){setAuditData(p=>({...p,[id]:{...p[id],condition:val}}));}
  function setNote(id,val){setAuditData(p=>({...p,[id]:{...p[id],note:val}}));}
  function clearAll(){if(!window.confirm('ล้างข้อมูลการตรวจทั้งหมด?'))return;setAuditData({});setScannedIds([]);setPhase('scan');}

  async function submitAudit(){
    if(checked===0){showToast('ยังไม่ได้ตรวจรายการเลย ⚠','#FFB700');return;}
    setIsSaving(true);
    const ts=new Date().toISOString();
    const rows=scannedIds.map(id=>{const item=items.find(it=>it.id===id);const d=auditData[id]||{};return{id,name:item?.name||id,cat:item?.cat||'',unit:item?.unit||'',condition:d.condition||'',note:d.note||''};}).filter(r=>r.condition);
    if(cfg.url){
      try{await fetch(cfg.url,{method:'POST',body:JSON.stringify({action:'asset_audit',timestamp:ts,auditor:loggedInEmp?.id||'',auditor_name:loggedInEmp?.displayName||'',rows})});showToast('บันทึกผลตรวจทรัพย์สินสำเร็จ ✓','var(--teal)');}
      catch(e){showToast('บันทึกในเครื่องแล้ว (ส่ง Sheet ไม่ได้)','#FFB700');}
    }else{showToast('บันทึกในเครื่องแล้ว (ยังไม่เชื่อม Sheet)','#FFB700');}
    setIsSaving(false);setPhase('done');
  }

  /* ── Done screen ── */
  if(phase==='done')return(
    <div style={{fontFamily:"'Noto Sans Thai',sans-serif",background:'var(--bg)',color:'var(--txt)',maxWidth:390,margin:'0 auto',minHeight:'100vh',overflowX:'hidden',paddingBottom:40}}>
      <AA_TopBar loggedInEmp={loggedInEmp} onLogout={handleLogout} syncStatus={syncStatus} onSync={syncData}/>
      <div style={{padding:'0 14px'}}>
        <div className="page-cinematic" style={{textAlign:'center',padding:'40px 0'}}>
          <div style={{fontSize:64,marginBottom:12}}>✅</div>
          <div style={{fontFamily:"'Outfit',sans-serif",fontSize:22,fontWeight:800,color:'var(--txt)',marginBottom:6}}>บันทึกผลตรวจแล้ว!</div>
          <div style={{fontSize:13,color:'var(--txt2)',marginBottom:16}}>{monthLabel}</div>
          <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap',marginBottom:24}}>
            <span style={{padding:'6px 14px',borderRadius:100,background:'var(--teal-dim)',color:'var(--mid-teal)',fontSize:13,fontWeight:700,border:'1px solid var(--teal-border)'}}><span style={{marginRight:4}}>✅</span>{normalItems.length} ปกติ</span>
            {issues.filter(id=>auditData[id]?.condition==='damaged').length>0&&<span style={{padding:'6px 14px',borderRadius:100,background:'#FFF4EC',color:'#CC6A00',fontSize:13,fontWeight:700,border:'1px solid #FFC899'}}><span style={{marginRight:4}}>⚠️</span>{issues.filter(id=>auditData[id]?.condition==='damaged').length} ชำรุด</span>}
            {issues.filter(id=>auditData[id]?.condition==='missing').length>0&&<span style={{padding:'6px 14px',borderRadius:100,background:'#FFF0F0',color:'#CC2222',fontSize:13,fontWeight:700,border:'1px solid #FFCDD2'}}><span style={{marginRight:4}}>❌</span>{issues.filter(id=>auditData[id]?.condition==='missing').length} หาย/ไม่พบ</span>}
          </div>
          <button onClick={clearAll} style={{padding:'13px 32px',borderRadius:20,border:'none',background:'linear-gradient(135deg,var(--teal),var(--mid-teal))',color:'#fff',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:15,fontWeight:700,cursor:'pointer',boxShadow:'0 6px 20px rgba(9,209,199,0.28)'}}>
            <i className="ti ti-rotate" style={{fontSize:16,verticalAlign:'-3px',marginRight:6}}/> เริ่มตรวจรอบใหม่
          </button>
        </div>
      </div>
      {toast&&<div style={{position:'fixed',bottom:40,left:'50%',transform:'translateX(-50%)',background:toast.color,color:'#fff',borderRadius:100,padding:'12px 24px',fontSize:13,zIndex:300,whiteSpace:'nowrap',boxShadow:'0 8px 32px rgba(33,58,88,0.2)',animation:'toastPop .3s cubic-bezier(0.34,1.56,0.64,1)'}}>{toast.msg}</div>}
    </div>
  );

  /* ── Review screen ── */
  if(phase==='review')return(
    <div style={{fontFamily:"'Noto Sans Thai',sans-serif",background:'var(--bg)',color:'var(--txt)',maxWidth:390,margin:'0 auto',minHeight:'100vh',overflowX:'hidden',paddingBottom:40}}>
      <AA_TopBar loggedInEmp={loggedInEmp} onLogout={handleLogout} syncStatus={syncStatus} onSync={syncData}/>
      <div style={{padding:'0 14px'}}>
        <div className="page-cinematic">
          <div style={{display:'flex',alignItems:'center',gap:10,margin:'14px 0 12px'}}>
            <button onClick={()=>setPhase('scan')} style={{background:'none',border:'none',cursor:'pointer',color:'var(--txt2)',fontSize:20,padding:'2px 6px'}}><i className="ti ti-arrow-left"/></button>
            <div style={{fontFamily:"'Outfit',sans-serif",fontWeight:800,fontSize:18,color:'var(--txt)'}}>สรุปผลการตรวจ</div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:12}}>
            {[{label:'ปกติ',val:normalItems.length,icon:'✅',color:'var(--teal)',bg:'var(--teal-dim)',border:'var(--teal-border)'},
              {label:'ชำรุด',val:issues.filter(id=>auditData[id]?.condition==='damaged').length,icon:'⚠️',color:'#CC6A00',bg:'#FFF4EC',border:'#FFC899'},
              {label:'หาย/ไม่พบ',val:issues.filter(id=>auditData[id]?.condition==='missing').length,icon:'❌',color:'#CC2222',bg:'#FFF0F0',border:'#FFCDD2'},
            ].map((s,i)=>(
              <div key={i} style={{background:s.bg,border:`1px solid ${s.border}`,borderRadius:14,padding:'10px 8px',textAlign:'center'}}>
                <div style={{fontSize:20,marginBottom:4}}>{s.icon}</div>
                <div style={{fontFamily:"'Outfit',sans-serif",fontSize:22,fontWeight:800,color:s.color,letterSpacing:'-1px'}}>{s.val}</div>
                <div style={{fontSize:10,color:s.color,fontWeight:600}}>{s.label}</div>
              </div>
            ))}
          </div>
          {issues.length>0&&(
            <div style={{background:'#FFF4EC',border:'1px solid #FFC899',borderRadius:16,padding:'12px 16px',marginBottom:10}}>
              <div style={{fontWeight:700,fontSize:12,color:'#CC6A00',marginBottom:8}}><i className="ti ti-alert-triangle" style={{marginRight:5}}/>รายการที่พบปัญหา</div>
              {issues.map((id,i)=>{
                const item=items.find(it=>it.id===id);const d=auditData[id];const opt=CONDITION_OPTIONS.find(c=>c.value===d?.condition);
                return(<div key={id} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 0',borderBottom:i<issues.length-1?'1px solid #FFE4CC':'none'}}>
                  <span style={{fontSize:18}}>{item?.icon||'📦'}</span>
                  <div style={{flex:1,minWidth:0}}><div style={{fontSize:12,fontWeight:700,color:'#6A3000',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item?.name||id}</div>{d?.note&&<div style={{fontSize:11,color:'#AA5500',marginTop:1,fontStyle:'italic'}}>{d.note}</div>}</div>
                  <span style={{fontSize:11,fontWeight:700,color:opt?.color,background:opt?.bg,padding:'2px 8px',borderRadius:100,border:`1px solid ${opt?.border}`,flexShrink:0}}>{opt?.icon} {opt?.label}</span>
                </div>);
              })}
            </div>
          )}
          {issues.length===0&&<div style={{textAlign:'center',padding:'12px 0 16px'}}><div style={{fontSize:40,marginBottom:8}}>🎉</div><div style={{fontFamily:"'Outfit',sans-serif",fontSize:16,fontWeight:800,color:'var(--teal)'}}>ทรัพย์สินทุกรายการอยู่ในสภาพปกติ!</div></div>}
          <div style={{fontSize:12,color:'var(--txt3)',textAlign:'center',marginBottom:16}}>ตรวจแล้ว {checked} จาก {total} รายการ</div>
          <button onClick={submitAudit} disabled={isSaving} style={{width:'100%',padding:15,borderRadius:20,border:'none',background:'linear-gradient(135deg,var(--teal),var(--mid-teal))',color:'#fff',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:15,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,boxShadow:'0 6px 20px rgba(9,209,199,0.28)',opacity:isSaving?0.7:1}}>
            <i className="ti ti-clipboard-check" style={{fontSize:18}}/>{isSaving?'กำลังบันทึก...':'ยืนยันส่งผลตรวจ'}
          </button>
        </div>
      </div>
      {toast&&<div style={{position:'fixed',bottom:40,left:'50%',transform:'translateX(-50%)',background:toast.color,color:'#fff',borderRadius:100,padding:'12px 24px',fontSize:13,zIndex:300,whiteSpace:'nowrap',boxShadow:'0 8px 32px rgba(33,58,88,0.2)',animation:'toastPop .3s cubic-bezier(0.34,1.56,0.64,1)'}}>{toast.msg}</div>}
    </div>
  );

  /* ── Main scan screen ── */
  return(
    <div style={{fontFamily:"'Noto Sans Thai',sans-serif",background:'var(--bg)',color:'var(--txt)',maxWidth:390,margin:'0 auto',minHeight:'100vh',overflowX:'hidden',paddingBottom:40}}>
      <AA_TopBar loggedInEmp={loggedInEmp} onLogout={handleLogout} syncStatus={syncStatus} onSync={syncData}/>
      <div style={{padding:'0 14px'}}>
        <div className="page-cinematic">
          {/* Header card */}
          <div style={{background:'linear-gradient(135deg,var(--navy),var(--deep-teal))',borderRadius:24,padding:'16px 18px',margin:'14px 0 10px',color:'#fff',boxShadow:'0 4px 16px rgba(33,58,88,0.18)'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
              <div style={{fontSize:28}}>🔍</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:"'Outfit',sans-serif",fontWeight:800,fontSize:17,letterSpacing:'-0.3px'}}>ตรวจนับทรัพย์สิน</div>
                <div style={{fontSize:11,opacity:0.65,marginTop:1}}>{monthLabel} · {loggedInEmp?.displayName}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontFamily:"'Outfit',sans-serif",fontWeight:800,fontSize:22,letterSpacing:'-1px'}}>{checked}<span style={{fontSize:13,fontWeight:400,opacity:0.65}}>/{total}</span></div>
                <div style={{fontSize:10,opacity:0.65}}>รายการ</div>
              </div>
            </div>
            <div style={{background:'rgba(255,255,255,0.12)',borderRadius:10,height:6,overflow:'hidden'}}>
              <div style={{height:'100%',borderRadius:10,background:'var(--teal)',width:`${pct}%`,transition:'.5s'}}/>
            </div>
          </div>

          {/* Admin: เพิ่มทรัพย์สิน */}
          {isAdmin&&(
            <button onClick={()=>setShowAddAsset(true)} style={{width:'100%',marginBottom:10,padding:'12px 18px',borderRadius:16,border:'2px dashed var(--teal-border)',background:'var(--teal-dim)',color:'var(--mid-teal)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:13,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
              <i className="ti ti-shield-check" style={{fontSize:15}}/>Admin · เพิ่มทรัพย์สินใหม่
            </button>
          )}

          {/* QR scan area */}
          <div style={{background:'var(--teal-dim)',border:'2px dashed var(--teal-border)',borderRadius:20,padding:'20px 16px',marginBottom:10,textAlign:'center'}}>
            <div style={{fontSize:11,color:'var(--txt3)',letterSpacing:'1px',marginBottom:10,fontFamily:"'Space Mono',monospace",textTransform:'uppercase'}}>สแกน QR บนตัวอุปกรณ์</div>
            <button onClick={()=>setShowCamera(true)} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,width:'100%',padding:'14px 20px',borderRadius:16,border:'none',background:'linear-gradient(135deg,var(--teal),var(--mid-teal))',color:'#fff',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:15,fontWeight:700,cursor:'pointer',boxShadow:'0 4px 14px rgba(9,209,199,0.3)',marginBottom:10}}>
              <i className="ti ti-camera" style={{fontSize:20}}/> เปิดกล้องสแกน QR
            </button>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <input ref={inputRef} value={scanCode} onChange={e=>setScanCode(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleScan(scanCode)} placeholder="หรือพิมพ์รหัส QR แล้วกด Enter" style={{flex:1,padding:'10px 14px',borderRadius:12,border:'1.5px solid var(--teal-border)',background:'var(--surface)',color:'var(--txt)',fontFamily:"'Space Mono',monospace",fontSize:13,outline:'none'}}/>
              <button onClick={()=>handleScan(scanCode)} style={{padding:'10px 14px',borderRadius:12,border:'none',background:'var(--teal)',color:'#fff',cursor:'pointer',fontSize:13,fontWeight:700,fontFamily:"'Noto Sans Thai',sans-serif",whiteSpace:'nowrap'}}>ค้นหา</button>
            </div>
          </div>

          {/* Scanned items list */}
          {scannedIds.length>0&&(
            <>
              <div style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:'var(--txt3)',letterSpacing:'1.4px',textTransform:'uppercase',marginBottom:6}}>รายการที่สแกนแล้ว ({scannedIds.length})</div>
              <div style={{background:'var(--surface)',border:'1px solid var(--teal-border)',borderRadius:20,padding:'0 16px',boxShadow:'var(--shadow-sm)',marginBottom:10}}>
                {scannedIds.map((id,i)=>{
                  const item=items.find(it=>it.id===id);if(!item)return null;
                  return(<div id={`audit-item-${id}`} key={id}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'flex-end',paddingTop:10,gap:6}}>
                      <button onClick={()=>setShowQR(item)} style={{display:'flex',alignItems:'center',gap:5,padding:'4px 10px',borderRadius:100,border:'1px solid var(--teal-border)',background:'var(--surface2)',color:'var(--mid-teal)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:11,fontWeight:600,cursor:'pointer'}}>
                        <i className="ti ti-qrcode" style={{fontSize:13}}/>QR
                      </button>
                    </div>
                    <AuditItemCard item={item} conditionData={auditData[id]} onSetCondition={setCondition} onSetNote={setNote} isLast={i===scannedIds.length-1}/>
                  </div>);
                })}
              </div>
            </>
          )}

          {scannedIds.length===0&&(
            <div style={{textAlign:'center',padding:'24px 0',color:'var(--txt3)',fontSize:13}}>
              <div style={{fontSize:40,marginBottom:10}}>📷</div>
              ยังไม่มีรายการ — เริ่มสแกน QR ที่ตัวอุปกรณ์ได้เลย
            </div>
          )}

          {/* Bottom actions */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 2fr',gap:8,marginBottom:16}}>
            <button onClick={clearAll} style={{padding:13,borderRadius:16,border:'1.5px solid var(--teal-border)',background:'var(--surface)',color:'var(--txt3)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:13,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:5}}>
              <i className="ti ti-eraser" style={{fontSize:15}}/>ล้าง
            </button>
            <button onClick={()=>{if(checked===0){showToast('กรุณาตรวจสภาพอย่างน้อย 1 รายการ ⚠','#FFB700');return;}setPhase('review');}} style={{padding:13,borderRadius:16,border:checked>0?'none':'1.5px solid var(--teal-border)',background:checked>0?'linear-gradient(135deg,var(--teal),var(--mid-teal))':'var(--surface)',color:checked>0?'#fff':'var(--txt3)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:14,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,boxShadow:checked>0?'0 4px 14px rgba(9,209,199,0.28)':'none'}}>
              <i className="ti ti-clipboard-check" style={{fontSize:16}}/>สรุปผล ({checked})
            </button>
          </div>

          {showCamera&&<AA_CameraOverlay onScan={code=>{setShowCamera(false);handleScan(code);}} onClose={()=>setShowCamera(false)}/>}
        </div>
      </div>
      {toast&&<div style={{position:'fixed',bottom:40,left:'50%',transform:'translateX(-50%)',background:toast.color,color:'#fff',borderRadius:100,padding:'12px 24px',fontSize:13,zIndex:300,whiteSpace:'nowrap',boxShadow:'0 8px 32px rgba(33,58,88,0.2)',animation:'toastPop .3s cubic-bezier(0.34,1.56,0.64,1)'}}>{toast.msg}</div>}
      {showAddAsset&&<AddAssetModal onClose={()=>setShowAddAsset(false)} onSaved={handleAssetSaved} gasUrl={cfg.url} showToast={showToast}/>}
      {showQR&&<QRLabelModal item={showQR} onClose={()=>setShowQR(null)}/>}
    </div>
  );
}

window.__renderAssetAudit = (el, portalUser) => ReactDOM.createRoot(el).render(<AssetAudit initialUser={portalUser}/>);

</script>

<!-- PORTAL CONTROLLER -->
<script>
/* ══════════════════════════════════════════
   PORTAL AUTH + LAUNCHER CONTROLLER
   ══════════════════════════════════════════ */

// ── Particles for login screen ──
(function spawnParticles() {
  const container = document.getElementById('pl-particles');
  if (!container) return;
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'pl-pt';
    const size = Math.random() * 4 + 2;
    el.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size}px;` +
      `opacity:${Math.random()*0.4+0.2};animation-duration:${Math.random()*12+8}s;` +
      `animation-delay:${Math.random()*10}s;`;
    container.appendChild(el);
  }
})();

// ── Auth helpers (same as StockScan) ──
const GAS_URL = "https://script.google.com/macros/s/AKfycbwTT1Ur-1FCJL7G-aXRiYY_fKhJhzMm41Z3Gp4XkSfNiAYWH74LNK-iw0yHBzg_K3Q/exec";

function plHashPin(pin) {
  let h = 2166136261;
  for (let i = 0; i < pin.length; i++) { h ^= pin.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h.toString(16).padStart(8, '0');
}
function plDefaultPw(empId) { return empId.replace(/[A-Za-z]/g, ''); }
function plLoadAuth() { try { return JSON.parse(localStorage.getItem('ss2_auth_v3')) || {}; } catch(e) { return {}; } }

// Employee list (shared with both apps — already defined globally by Babel scripts,
// but we need a plain-JS copy here for the vanilla login screen)
const PL_EMP_IDS = ["OD1158037","OD1161092","OD1159070","OD1159220","OD1159247","OD1161125","OD1162007","OD1166001","OD1160082","OD1158048","OD1159216","OD1159279","OD1160081","OD1160088","OD1160351","OD1160406","OD1161069","OD1161078","OD1161079","OD1161134","OD1161280","OD1161363","OD1161392","OD1162045","OD1162099","OD1162130","OD1162131","OD1162154","OD1162203","OD1162404","OD1162769","OD1165002","OD1165005","OD1165007","OD1166001","OD1167009","OD1169007","20085","671166","OD1162151"];

// ── Portal state ──
let portalAuthData  = plLoadAuth();
let portalUser      = null;   // { id, displayName }
let portalSyncing   = false;
let portalSynced    = Object.keys(portalAuthData).length > 0;

// ── Sync auth from GAS on load ──
async function portalSyncAuth() {
  if (portalSyncing) return;
  portalSyncing = true;
  showSyncing(true);
  try {
    const res = await fetch(GAS_URL + '?_t=' + Date.now(), { mode: 'cors' });
    const data = await res.json();
    if (data && data.auth && typeof data.auth === 'object') {
      portalAuthData = { ...portalAuthData, ...data.auth };
      localStorage.setItem('ss2_auth_v3', JSON.stringify(portalAuthData));
      portalSynced = true;
    }
  } catch(e) {
    // JSONP fallback
    try {
      const data = await new Promise((res, rej) => {
        const cb = '_plcb_' + Date.now();
        const s = document.createElement('script');
        const t = setTimeout(() => { delete window[cb]; s.remove(); rej(); }, 12000);
        window[cb] = d => { clearTimeout(t); delete window[cb]; s.remove(); res(d); };
        s.src = GAS_URL + '?callback=' + cb + '&_t=' + Date.now();
        s.onerror = () => { clearTimeout(t); delete window[cb]; s.remove(); rej(); };
        document.head.appendChild(s);
      });
      if (data && data.auth) {
        portalAuthData = { ...portalAuthData, ...data.auth };
        localStorage.setItem('ss2_auth_v3', JSON.stringify(portalAuthData));
        portalSynced = true;
      }
    } catch(e2) { /* offline — use cache */ }
  }
  portalSyncing = false;
  showSyncing(false);
}

function showSyncing(on) {
  const el = document.getElementById('pl-syncing');
  if (el) el.style.display = on ? 'flex' : 'none';
}
function showError(msg) {
  const el = document.getElementById('pl-error');
  if (!el) return;
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
  // shake card
  const card = document.querySelector('.pl-card');
  if (card) {
    card.style.animation = 'shake 0.4s ease';
    setTimeout(() => card.style.animation = '', 450);
  }
}
function clearError() {
  const el = document.getElementById('pl-error');
  if (el) { el.textContent = ''; el.style.display = 'none'; }
}

// ── Portal Login handler ──
function portalLogin() {
  clearError();
  const username = document.getElementById('pl-username').value.trim();
  const password = document.getElementById('pl-password').value;

  if (!username) { showError('กรุณากรอกรหัสพนักงาน'); return; }
  if (!password) { showError('กรุณากรอกรหัสผ่าน'); return; }

  // Validate employee ID exists
  if (!PL_EMP_IDS.includes(username)) {
    showError('ไม่พบรหัสพนักงานนี้ในระบบ'); return;
  }

  const record = portalAuthData[username];
  const isFirst = !record || !record.changed;

  if (isFirst) {
    if (password !== plDefaultPw(username)) {
      showError('รหัสผ่านไม่ถูกต้อง\n(ครั้งแรก: ใช้ตัวเลขจากรหัสพนักงาน)');
      return;
    }
  } else {
    if (plHashPin(password) !== record.hash) {
      showError('รหัสผ่านไม่ถูกต้อง');
      return;
    }
  }

  // ✓ Authenticated
  const btn = document.getElementById('pl-btn');
  if (btn) { btn.textContent = 'กำลังเข้าสู่ระบบ...'; btn.disabled = true; }

  // Build a simple user object (display name fetched from Babel EMPLOYEES if available)
  setTimeout(() => {
    portalUser = { id: username };
    // Try to get display name from global EMPLOYEES (set by Babel after load)
    if (window.EMPLOYEES) {
      const emp = window.EMPLOYEES.find(e => e.id === username);
      if (emp) portalUser.displayName = emp.displayName || emp.name;
    }
    if (!portalUser.displayName) {
      portalUser.displayName = username;
    }
    enterPortal();
  }, 380);
}

// ── Enter portal (hide login, show launcher) ──
function enterPortal() {
  const login = document.getElementById('portal-login');
  login.classList.add('hide');
  setTimeout(() => { login.style.display = 'none'; }, 420);
  // Show portal shell
  document.getElementById('portal-shell').style.opacity = '1';
  document.getElementById('portal-shell').style.pointerEvents = '';
  updateClock();
}

// Hide portal shell initially until login passes
document.getElementById('portal-shell').style.opacity = '0';
document.getElementById('portal-shell').style.pointerEvents = 'none';

// ── Clock ──
function updateClock() {
  const d = new Date();
  const el = document.getElementById('p-clock');
  if (el) el.textContent =
    d.getHours().toString().padStart(2,'0') + ':' +
    d.getMinutes().toString().padStart(2,'0') + ' น.';
}
setInterval(updateClock, 15000);

// ── App launcher ──
const APPS = {
  stockscan:  { name:'StockScan',   icon:'📦', grad:'linear-gradient(135deg,#09D1C7,#0C6478)', renderFn:'__renderStockScan' },
  assetaudit: { name:'Asset Audit', icon:'🔍', grad:'linear-gradient(135deg,#46DFB1,#15919B)', renderFn:'__renderAssetAudit' },
};

let activeApp = null;
const rendered = {};
const mounts = {};

function openApp(appId) {
  if (!portalUser) return; // guard
  const app = APPS[appId];
  if (!app) return;
  activeApp = appId;

  const oi = document.getElementById('ov-icon');
  oi.textContent = app.icon;
  oi.style.background = app.grad;
  document.getElementById('ov-name').textContent = app.name;

  const root = document.getElementById('app-root');

  if (!rendered[appId]) {
    rendered[appId] = true;
    const mountEl = document.createElement('div');
    mountEl.id = 'mount-' + appId;
    mountEl.style.minHeight = '100%';
    mounts[appId] = mountEl;
    root.innerHTML = '';
    root.appendChild(mountEl);
    setTimeout(() => {
      if (window[app.renderFn]) window[app.renderFn](mountEl, portalUser);
    }, 60);
  } else {
    root.innerHTML = '';
    if (mounts[appId]) root.appendChild(mounts[appId]);
  }

  requestAnimationFrame(() => {
    document.getElementById('app-overlay').classList.add('open');
    document.getElementById('portal-shell').classList.add('behind');
  });
}

function closeApp() {
  document.getElementById('app-overlay').classList.remove('open');
  document.getElementById('portal-shell').classList.remove('behind');
  activeApp = null;
}
window.closeApp = closeApp;

// ── Kick off GAS sync on load ──
portalSyncAuth();
</script>
