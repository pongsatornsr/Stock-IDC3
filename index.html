<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StockScan — IDC3</title>
  <link rel="manifest" href="">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Noto+Sans+Thai:wght@300;400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #09D1C7; --teal-dim: #E4F7F6; --teal-border: #99DDD9;
      --mint: #46DFB1; --mint-dim: #E5F7F0; --mint-border: #96DEC5;
      --mid-teal: #15919B; --deep-teal: #0C6478; --navy: #213A58;
      --bg: #EEF5F7; --surface: #FFFFFF; --surface2: #F5FAFB;
      --txt: #213A58; --txt2: #4A6878; --txt3: #8AACB8;
      --r: 14px; --r2: 20px; --r3: 28px;
      --shadow-sm: 0 1px 4px rgba(33,58,88,0.06), 0 2px 8px rgba(33,58,88,0.04);
      --shadow-md: 0 4px 16px rgba(33,58,88,0.08), 0 1px 4px rgba(33,58,88,0.05);
    }
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); }
    body { font-family: 'Noto Sans Thai', sans-serif; font-size: 14px; line-height: 1.5; color: var(--txt); }
    #root { max-width: 390px; margin: 0 auto; min-height: 100vh; }
    input, select, button { font-family: inherit; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
    @keyframes toastPop { from { opacity:0; transform:translateX(-50%) translateY(8px) scale(0.92) } to { opacity:1; transform:translateX(-50%) translateY(0) scale(1) } }
    @keyframes scanLine { 0%,100% { top:8px; opacity:0 } 10% { opacity:1 } 90% { opacity:1 } 50% { top:calc(100% - 8px) } }
    @keyframes shake { 0%,100%{transform:none} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
    @keyframes slideDown { from { opacity:0; transform:translateY(-6px) } to { opacity:1; transform:none } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    /* ─── Helpers ─── */
    function parseTs(s) { try { const d=new Date(s); return isNaN(d)?null:d; } catch(e){return null;} }
    function displayTs(s) { try { return new Date(s).toLocaleString('th-TH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e){return s||'—';} }
    function normalizeItems(arr) {
      if (!Array.isArray(arr)) return [];
      return arr.map(it=>({ id:String(it.id||it.ID||'').trim(), name:String(it.name||it.Name||'').trim(), cat:String(it.cat||it.category||it.Category||'').trim(), stock:Number(String(it.stock??it.Stock??0).replace(/[^0-9.]/g,''))||0, unit:String(it.unit||it.Unit||'อัน').trim(), min:Number(String(it.min??it.Min??0).replace(/[^0-9.]/g,''))||0, icon:String(it.icon||it.Icon||'📦').trim() })).filter(it=>it.id);
    }
    function normalizeLogs(arr) {
      if (!Array.isArray(arr)) return [];
      return arr.map(l=>({ timestamp:String(l.timestamp||'').trim(), qr_id:String(l.qr_id||'').trim(), item_name:String(l.item_name||l.Item_Name||l.name||'').trim(), cat:String(l.cat||l.category||'').trim(), quantity:parseInt(String(l.quantity??l.Quantity??0))||0, unit:String(l.unit||l.Unit||'').trim(), employee:String(l.employee||l.Employee||'').trim(), note:String(l.note||l.Note||'').trim(), action:String(l.action||'withdraw').trim() }));
    }
    function uid() { return 'QR-'+Date.now().toString(36).toUpperCase().slice(-4)+Math.random().toString(36).substr(2,3).toUpperCase(); }
    function nowISO() { return new Date().toISOString(); }
    function loadLocal(key,fb) { try{return JSON.parse(localStorage.getItem(key))||fb;}catch(e){return fb;} }

    /* fuzzy match: ทุก keyword ในคำค้นต้องอยู่ในชื่อ (ลำดับไม่สนใจ) */
    function fuzzyMatch(text, query) {
      if (!query) return true;
      const t = text.toLowerCase();
      const words = query.toLowerCase().trim().split(/\s+/);
      return words.every(w => t.includes(w));
    }

    /* ─── Constants ─── */
    const SECURE_PIN = "240739";
    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbyOqsDZbO6E8W0Ka0EF8jv-BalyMtSiYorH8Vc4lZy3H_fIkeVfaMdldrkvAMBeyFOo/exec";

    /* ─── LogRow ─── */
    function LogRow({ l, items, showTime, isLast }) {
      const it = items.find(x=>x.id===l.qr_id);
      const icon = it ? it.icon : '📦';
      const qty = Number(l.quantity)||0;
      const isReturn = l.action === 'return';
      const isRestock = l.action === 'restock';
      return (
        <div style={{ display:'flex', alignItems:'center', gap:'10px', padding:'10px 0', borderBottom: isLast?'none':'1px solid var(--teal-border)' }}>
          <div style={{ width:'40px',height:'40px',borderRadius:'12px',background: isReturn?'#EEF7FF': isRestock?'var(--mint-dim)':'var(--teal-dim)',border:`1px solid ${isReturn?'#BDD5F5':isRestock?'var(--mint-border)':'var(--teal-border)'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px',flexShrink:0,position:'relative' }}>
            {icon}
            {isReturn && <div style={{ position:'absolute',bottom:'-3px',right:'-3px',width:'14px',height:'14px',borderRadius:'50%',background:'#4A90D9',border:'1.5px solid #fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'8px',color:'#fff' }}>↩</div>}
            {isRestock && <div style={{ position:'absolute',bottom:'-3px',right:'-3px',width:'14px',height:'14px',borderRadius:'50%',background:'var(--mint)',border:'1.5px solid #fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'8px',color:'#fff' }}>+</div>}
          </div>
          <div style={{ flex:1,minWidth:0 }}>
            <div style={{ fontWeight:700,fontSize:'13px',color:'var(--txt)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap' }}>{l.item_name||l.qr_id}</div>
            <div style={{ fontSize:'12px',color:'var(--txt2)' }}>{l.employee||'—'}</div>
            {showTime && l.timestamp && <div style={{ fontFamily:"'Space Mono',monospace",fontSize:'10px',color:'var(--txt3)',marginTop:'1px' }}>{displayTs(l.timestamp)}</div>}
            {l.note && <div style={{ fontSize:'11px',color:'var(--txt3)',marginTop:'1px',fontStyle:'italic' }}>{l.note}</div>}
          </div>
          <div style={{ display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'2px',flexShrink:0 }}>
            <div style={{ fontFamily:"'Outfit',sans-serif",fontSize:'24px',fontWeight:800,color: isReturn?'#4A90D9': isRestock?'var(--mint)':'var(--teal)',letterSpacing:'-1px',lineHeight:1 }}>
              {isReturn?'-':isRestock?'+':''}{qty}<span style={{ fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'11px',color:'var(--txt3)',fontWeight:400,marginLeft:'3px' }}>{l.unit}</span>
            </div>
            {isReturn && <span style={{ fontSize:'9px',color:'#4A90D9',background:'#EEF7FF',padding:'1px 6px',borderRadius:'100px',border:'1px solid #BDD5F5' }}>คืน</span>}
            {isRestock && <span style={{ fontSize:'9px',color:'var(--mid-teal)',background:'var(--mint-dim)',padding:'1px 6px',borderRadius:'100px',border:'1px solid var(--mint-border)' }}>เติม</span>}
          </div>
        </div>
      );
    }

    /* ─── TopBar ─── */
    const STATUS_MAP = {
      syncing:{color:'var(--txt3)',text:'กำลังซิงค์...'},
      ok:{color:'var(--teal)',text:'ข้อมูลตรงกัน ✓'},
      error:{color:'#FF4D4D',text:'ซิงค์ไม่ได้ ⚠'},
      none:{color:'var(--txt3)',text:'ยังไม่ได้เชื่อม Sheet'},
    };
    function TopBar({ syncStatus, onSync }) {
      const s = STATUS_MAP[syncStatus]||STATUS_MAP.none;
      return (
        <div style={{ padding:'20px 16px 0',display:'flex',alignItems:'center',justifyContent:'space-between' }}>
          <div style={{ display:'flex',alignItems:'center',gap:'8px' }}>
            <div style={{ background:'var(--navy)',color:'#fff',fontFamily:"'Outfit',sans-serif",fontWeight:800,fontSize:'13px',padding:'5px 14px',borderRadius:'100px',letterSpacing:'0.3px',boxShadow:'0 2px 8px rgba(33,58,88,0.18)' }}>Stock</div>
            <span style={{ fontSize:'11px',color:'var(--txt3)',fontFamily:"'Space Mono',monospace",letterSpacing:'.5px' }}>IDC3</span>
          </div>
          <div onClick={onSync} style={{ display:'flex',alignItems:'center',gap:'6px',cursor:'pointer',padding:'6px 12px',borderRadius:'100px',background:'var(--surface)',border:'1px solid var(--teal-border)',boxShadow:'var(--shadow-sm)' }}>
            <div style={{ width:'7px',height:'7px',borderRadius:'50%',background:s.color,flexShrink:0 }} />
            <span style={{ fontSize:'11px',color:s.color,fontFamily:"'Space Mono',monospace" }}>{s.text}</span>
          </div>
        </div>
      );
    }

    /* ─── BottomNav ─── */
    function NavBtn({ active, icon, label, onClick }) {
      return (
        <button onClick={onClick} style={{ flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:'3px',padding:'8px 4px',cursor:'pointer',border:'none',background:'transparent',color:active?'var(--teal)':'var(--txt3)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'10px',transition:'.2s',borderRadius:'8px',position:'relative' }}>
          <i className={`ti ${icon}`} style={{ fontSize:'22px',transform:active?'translateY(-2px) scale(1.1)':'none',transition:'.2s cubic-bezier(0.34,1.56,0.64,1)' }} />
          <span>{label}</span>
          {active && <div style={{ position:'absolute',bottom:0,width:'20px',height:'3px',background:'var(--teal)',borderRadius:'100px 100px 0 0' }} />}
        </button>
      );
    }
    function BottomNav({ activePage, onGoHome, onGoLog, onGoScan, onGoAdmin, onGoSetup }) {
      return (
        <div style={{ position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:'390px',background:'rgba(255,255,255,0.95)',backdropFilter:'blur(20px) saturate(180%)',borderTop:'1px solid var(--teal-border)',display:'flex',zIndex:50,padding:'8px 4px 20px',boxShadow:'0 -4px 24px rgba(33,58,88,0.06)' }}>
          <NavBtn active={activePage==='home'} icon="ti-layout-dashboard" label="ภาพรวม" onClick={onGoHome} />
          <NavBtn active={activePage==='log'}  icon="ti-list"             label="Log"    onClick={onGoLog} />
          <div style={{ flex:1,display:'flex',alignItems:'center',justifyContent:'center',position:'relative' }}>
            <button onClick={onGoScan} style={{ position:'absolute',bottom:'8px',width:'52px',height:'52px',borderRadius:'50%',background:'linear-gradient(135deg, var(--teal), var(--mid-teal))',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 0 4px var(--bg), 0 6px 20px rgba(9,209,199,0.35)',transition:'.2s cubic-bezier(0.34,1.56,0.64,1)' }}>
              <i className="ti ti-scan" style={{ fontSize:'22px',color:'#fff' }} />
            </button>
          </div>
          <NavBtn active={activePage==='admin'} icon="ti-package"  label="เพิ่มอุปกรณ์" onClick={onGoAdmin} />
          <NavBtn active={activePage==='setup'} icon="ti-settings" label="ตั้งค่า"      onClick={onGoSetup} />
        </div>
      );
    }

    /* ─── PinModal ─── */
    function PinModal({ target, correctPin, onSuccess, onClose }) {
      const [buf,setBuf] = useState('');
      const [error,setError] = useState('');
      const [shake,setShake] = useState(false);
      useEffect(()=>{setBuf('');setError('');},[target]);
      const addKey = k => {
        if (buf.length>=6) return;
        const next = buf+k;
        setBuf(next); setError('');
        if (next.length===6) {
          setTimeout(()=>{
            if (next===correctPin) { onSuccess(); }
            else { setError('❌ รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง'); setShake(true); setBuf(''); setTimeout(()=>setShake(false),400); }
          },120);
        }
      };
      const del = () => { setBuf(p=>p.slice(0,-1)); setError(''); };
      const keys = ['1','2','3','4','5','6','7','8','9'];
      return (
        <div style={{ position:'fixed',inset:0,zIndex:200,background:'rgba(33,58,88,0.4)',backdropFilter:'blur(8px)',display:'flex',alignItems:'flex-end' }} onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div style={{ background:'var(--surface)',borderRadius:'28px 28px 0 0',padding:'28px 20px 40px',width:'100%',maxWidth:'390px',margin:'0 auto',borderTop:'1px solid var(--teal-border)',boxShadow:'0 -8px 40px rgba(33,58,88,0.14)' }}>
            <div style={{ width:'36px',height:'4px',background:'var(--teal-border)',borderRadius:'100px',margin:'0 auto 24px' }} />
            <div style={{ textAlign:'center',fontSize:'28px',marginBottom:'8px' }}>🔒</div>
            <div style={{ fontFamily:"'Outfit',sans-serif",fontSize:'20px',fontWeight:800,textAlign:'center',color:'var(--txt)',marginBottom:'4px' }}>Admin Mode</div>
            <div style={{ fontSize:'12px',color:'var(--txt3)',textAlign:'center',marginBottom:'20px' }}>กรอกรหัส PIN เพื่อเข้าสู่โหมด Admin</div>
            <div style={{ display:'flex',gap:'12px',justifyContent:'center',marginBottom:'20px',animation:shake?'shake .3s ease':'none' }}>
              {Array.from({length:6},(_,i)=>(
                <div key={i} style={{ width:'14px',height:'14px',borderRadius:'50%',border:`2px solid ${i<buf.length?'var(--teal)':'var(--teal-border)'}`,background:i<buf.length?'var(--teal)':'transparent',transition:'.2s',boxShadow:i<buf.length?'0 0 8px rgba(9,209,199,0.35)':'none' }} />
              ))}
            </div>
            <div style={{ display:'grid',gridTemplateColumns:'repeat(3, 1fr)',gap:'10px' }}>
              {keys.map(k=>(
                <button key={k} onClick={()=>addKey(k)} style={{ background:'var(--teal-dim)',border:'1.5px solid var(--teal-border)',borderRadius:'20px',padding:'18px',fontFamily:"'Outfit',sans-serif",fontSize:'22px',fontWeight:800,color:'var(--txt)',cursor:'pointer',transition:'.15s',textAlign:'center' }}>{k}</button>
              ))}
              <div />
              <button onClick={()=>addKey('0')} style={{ background:'var(--teal-dim)',border:'1.5px solid var(--teal-border)',borderRadius:'20px',padding:'18px',fontFamily:"'Outfit',sans-serif",fontSize:'22px',fontWeight:800,color:'var(--txt)',cursor:'pointer',transition:'.15s',textAlign:'center' }}>0</button>
              <button onClick={del} style={{ background:'var(--teal-dim)',border:'1.5px solid var(--teal-border)',borderRadius:'20px',padding:'18px',fontSize:'16px',color:'var(--txt2)',cursor:'pointer',transition:'.15s',textAlign:'center' }}>⌫</button>
            </div>
            <div style={{ textAlign:'center',color:'#e03030',fontSize:'12px',marginTop:'12px',minHeight:'18px' }}>{error}</div>
            <button onClick={onClose} style={{ width:'100%',padding:'13px',borderRadius:'20px',marginTop:'12px',border:'1.5px solid var(--teal-border)',background:'var(--surface)',color:'var(--txt2)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'15px',fontWeight:600,cursor:'pointer' }}>ยกเลิก</button>
          </div>
        </div>
      );
    }

    /* ─── CameraOverlay ─── */
    function CameraOverlay({ onScan, onClose }) {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const rafRef = useRef(null);
      const [status,setStatus] = useState('กำลังเปิดกล้อง...');
      useEffect(()=>{
        let lastScan=0,active=true;
        async function start() {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
            if(!active){stream.getTracks().forEach(t=>t.stop());return;}
            streamRef.current=stream; const video=videoRef.current; video.srcObject=stream; await video.play();
            setStatus('พร้อมสแกน ✓'); scanLoop();
          } catch(err){setStatus('❌ ไม่สามารถเปิดกล้องได้');setTimeout(()=>onClose(),2000);}
        }
        function scanLoop(){
          const video=videoRef.current; const canvas=canvasRef.current;
          if(!video||!canvas)return; const ctx=canvas.getContext('2d');
          function tick(){
            if(!active)return;
            if(video.readyState===video.HAVE_ENOUGH_DATA){
              canvas.width=video.videoWidth; canvas.height=video.videoHeight;
              ctx.drawImage(video,0,0,canvas.width,canvas.height);
              const now=Date.now();
              if(now-lastScan>300){lastScan=now;try{const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);const code=window.jsQR&&window.jsQR(imgData.data,imgData.width,imgData.height,{inversionAttempts:'dontInvert'});if(code&&code.data){active=false;onScan(code.data.trim());return;}}catch(e){}}
            }
            rafRef.current=requestAnimationFrame(tick);
          }
          rafRef.current=requestAnimationFrame(tick);
        }
        start();
        return()=>{active=false;if(rafRef.current)cancelAnimationFrame(rafRef.current);if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());};
      },[]);
      return (
        <div style={{ position:'fixed',inset:0,zIndex:100,background:'#000',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center' }}>
          <video ref={videoRef} autoPlay playsInline muted style={{ width:'100%',maxWidth:'390px',height:'100%',objectFit:'cover',position:'absolute',inset:0 }} />
          <canvas ref={canvasRef} style={{ display:'none' }} />
          <button onClick={onClose} style={{ position:'absolute',top:'48px',right:'16px',zIndex:20,background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.3)',color:'#fff',borderRadius:'50%',width:'44px',height:'44px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px',cursor:'pointer',backdropFilter:'blur(10px)' }}>
            <i className="ti ti-x" />
          </button>
          <div style={{ position:'relative',zIndex:10,display:'flex',flexDirection:'column',alignItems:'center',gap:'16px',width:'100%' }}>
            <div style={{ width:'240px',height:'240px',borderRadius:'20px',position:'relative',boxShadow:'0 0 0 2000px rgba(33,58,88,0.6)' }}>
              {[{top:0,left:0,borderWidth:'3px 0 0 3px',borderRadius:'10px 0 0 0'},{top:0,right:0,borderWidth:'3px 3px 0 0',borderRadius:'0 10px 0 0'},{bottom:0,left:0,borderWidth:'0 0 3px 3px',borderRadius:'0 0 0 10px'},{bottom:0,right:0,borderWidth:'0 3px 3px 0',borderRadius:'0 0 10px 0'}].map((s,i)=>(
                <div key={i} style={{ position:'absolute',width:'44px',height:'44px',borderColor:'var(--teal)',borderStyle:'solid',...s }} />
              ))}
              <div style={{ position:'absolute',left:'4px',right:'4px',height:'2px',background:'linear-gradient(90deg, transparent, var(--teal), transparent)',animation:'scanLine 2s ease-in-out infinite' }} />
            </div>
            <div style={{ color:'rgba(255,255,255,0.7)',fontSize:'13px',textAlign:'center' }}>วาง QR Code ให้อยู่ในกรอบ</div>
            <div style={{ color:'#fff',fontFamily:"'Space Mono',monospace",fontSize:'11px',textAlign:'center',minHeight:'16px' }}>{status}</div>
          </div>
          <button onClick={()=>{onClose();setTimeout(()=>document.getElementById('manual-input')?.focus(),200);}} style={{ position:'absolute',bottom:'100px',left:'50%',transform:'translateX(-50%)',zIndex:20,background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.3)',color:'#fff',borderRadius:'100px',padding:'10px 24px',fontSize:'13px',fontFamily:"'Noto Sans Thai',sans-serif",cursor:'pointer',backdropFilter:'blur(10px)',whiteSpace:'nowrap' }}>⌨ พิมพ์รหัสแทน</button>
        </div>
      );
    }

    /* ─── PageHome ─── */
    function StatCard({ icon, value, label, accent, dimBg, borderColor }) {
      return (
        <div style={{ background:dimBg,border:`1.5px solid ${borderColor}`,borderRadius:'20px',padding:'18px 16px',boxShadow:'0 2px 8px rgba(33,58,88,0.06)' }}>
          <i className={`ti ${icon}`} style={{ fontSize:'20px',color:accent,marginBottom:'8px',display:'block' }} />
          <div style={{ fontFamily:"'Outfit',sans-serif",fontSize:'32px',fontWeight:800,lineHeight:1,letterSpacing:'-1.5px',color:accent }}>{value}</div>
          <div style={{ fontSize:'11px',marginTop:'5px',fontWeight:600,color:accent,opacity:0.8 }}>{label}</div>
        </div>
      );
    }
    function PageHome({ items, logs, onGoScan }) {
      const now=new Date(), ws=new Date(now);
      ws.setDate(now.getDate()-now.getDay()); ws.setHours(0,0,0,0);
      const wl=logs.filter(l=>{const d=parseTs(l.timestamp);return d&&d>=ws;});
      const tl=logs.filter(l=>{const d=parseTs(l.timestamp);return d&&d.toDateString()===now.toDateString();});
      const lo=items.filter(x=>x.stock<=x.min);
      const lastTs=logs.length?parseTs(logs[0].timestamp):null;
      const recent=logs.slice(0,4);
      const Card=({children})=>(<div style={{ background:'var(--surface)',border:'1px solid var(--teal-border)',borderRadius:'20px',padding:'4px 16px',boxShadow:'var(--shadow-sm)' }}>{children}</div>);
      const Eyebrow=({children})=>(<div style={{ fontFamily:"'Space Mono',monospace",fontSize:'10px',color:'var(--txt3)',letterSpacing:'1.6px',textTransform:'uppercase',marginBottom:'8px',marginTop:'20px' }}>{children}</div>);
      return (
        <div style={{ animation:'fadeUp .2s ease' }}>
          <div style={{ background:'linear-gradient(135deg, #0C6478 0%, #213A58 100%)',borderRadius:'28px',padding:'22px',marginTop:'14px',marginBottom:'4px',position:'relative',overflow:'hidden',boxShadow:'0 8px 32px rgba(33,58,88,0.22)' }}>

    /* ─── ItemActionPanel — ใช้ร่วมกัน withdraw / return / restock ─── */
    function ItemActionPanel({ curItem, onConfirm, onCancel }) {
      const [mode, setMode] = useState('withdraw'); // 'withdraw' | 'return' | 'restock'
      const [user, setUser] = useState('');
      const [qty, setQty] = useState(1);
      const [note, setNote] = useState('');

      const handleConfirm = () => { onConfirm(mode, user, Number(qty), note); setUser(''); setQty(1); setNote(''); };

      const isLow = curItem.stock <= curItem.min;

      const IS = {background:'var(--surface)',border:'1.5px solid var(--teal-border)',borderRadius:'14px',color:'var(--txt)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'14px',padding:'13px 14px',width:'100%',outline:'none',boxShadow:'var(--shadow-sm)'};
      const LS = {fontSize:'12px',color:'var(--txt2)',display:'block',marginBottom:'6px',marginTop:'14px',fontWeight:500};

      const modeConfigs = {
        withdraw: { label:'เบิกอุปกรณ์', icon:'ti-arrow-up-right', color:'var(--teal)', grad:'linear-gradient(135deg, var(--teal), var(--mid-teal))', shadow:'0 6px 20px rgba(9,209,199,0.3)', userLabel:'ชื่อผู้เบิก', userPlaceholder:'ชื่อ หรือรหัสพนักงาน', qtyLabel:'จำนวนที่เบิก', btnLabel:'ยืนยันการเบิก' },
        return:   { label:'คืนอุปกรณ์',  icon:'ti-arrow-back-up', color:'#4A90D9', grad:'linear-gradient(135deg, #4A90D9, #2c6cb0)', shadow:'0 6px 20px rgba(74,144,217,0.3)', userLabel:'ชื่อผู้คืน', userPlaceholder:'ชื่อ หรือรหัสพนักงาน', qtyLabel:'จำนวนที่คืน', btnLabel:'ยืนยันการคืน' },
        restock:  { label:'เติม Stock',   icon:'ti-plus',          color:'var(--mint)', grad:'linear-gradient(135deg, var(--mint), #29b889)', shadow:'0 6px 20px rgba(70,223,177,0.3)', userLabel:'ชื่อผู้เติม', userPlaceholder:'ผู้รับผิดชอบ / ผู้จัดซื้อ', qtyLabel:'จำนวนที่เพิ่ม', btnLabel:'ยืนยันการเติม Stock' },
      };
      const mc = modeConfigs[mode];

      return (
        <div style={{ animation:'fadeUp .2s ease' }}>
          {/* Item Card */}
          <div style={{ background:'var(--teal-dim)',border:'1.5px solid var(--teal-border)',borderRadius:'28px',padding:'20px',margin:'14px 0 0',boxShadow:'var(--shadow-md)' }}>
            <div style={{ fontSize:'38px',marginBottom:'8px' }}>{curItem.icon}</div>
            <div style={{ fontFamily:"'Outfit',sans-serif",fontSize:'22px',fontWeight:800,letterSpacing:'-0.5px',color:'var(--txt)' }}>{curItem.name}</div>
            <div style={{ fontFamily:"'Space Mono',monospace",fontSize:'11px',color:'var(--txt3)',marginTop:'2px' }}>{curItem.id}</div>
            <div style={{ display:'flex',gap:'6px',flexWrap:'wrap',margin:'10px 0' }}>
              <span style={{ display:'inline-flex',alignItems:'center',gap:'4px',padding:'4px 10px',borderRadius:'100px',fontSize:'11px',fontWeight:600,background:'rgba(9,209,199,0.15)',color:'var(--mid-teal)',border:'1px solid var(--teal-border)' }}>{curItem.cat}</span>
              <span style={{ display:'inline-flex',alignItems:'center',gap:'4px',padding:'4px 10px',borderRadius:'100px',fontSize:'11px',fontWeight:600,background:isLow?'#FFF4EC':'var(--mint-dim)',color:isLow?'#CC6A00':'var(--mid-teal)',border:`1px solid ${isLow?'#FFC899':'var(--mint-border)'}` }}>{isLow?'สต๊อกใกล้หมด':'สต๊อกปกติ'}</span>
            </div>
            <div style={{ display:'flex',alignItems:'baseline',gap:'8px',margin:'4px 0 0' }}>
              <div style={{ fontFamily:"'Outfit',sans-serif",fontSize:'40px',fontWeight:800,color:isLow?'#CC6A00':'var(--teal)',letterSpacing:'-1.5px' }}>{curItem.stock}</div>
              <div style={{ fontSize:'13px',color:'var(--txt2)' }}>{curItem.unit}</div>
              <div style={{ fontSize:'11px',color:'var(--txt3)' }}>คงเหลือ</div>
            </div>
          </div>

          {/* Mode Selector */}
          <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'6px',margin:'10px 0' }}>
            {Object.entries(modeConfigs).map(([key,mc2])=>(
              <button key={key} onClick={()=>setMode(key)} style={{ padding:'9px 4px',borderRadius:'14px',border:`1.5px solid ${mode===key?mc2.color:'var(--teal-border)'}`,background:mode===key?mc2.grad:'var(--surface)',color:mode===key?'#fff':'var(--txt2)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'12px',fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'4px',transition:'.2s',boxShadow:mode===key?mc2.shadow:'var(--shadow-sm)' }}>
                <i className={`ti ${mc2.icon}`} style={{ fontSize:'13px' }} />
                {mc2.label}
              </button>
            ))}
          </div>

          {/* Form */}
          <div style={{ background:'var(--surface)',border:'1px solid var(--teal-border)',borderRadius:'20px',padding:'16px',boxShadow:'var(--shadow-sm)',animation:'slideDown .2s ease' }}>
            <label style={LS}>{mc.userLabel}</label>
            <input value={user} onChange={e=>setUser(e.target.value)} placeholder={mc.userPlaceholder} style={IS} />
            <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px' }}>
              <div><label style={LS}>{mc.qtyLabel}</label><input value={qty} onChange={e=>setQty(e.target.value)} type="number" min="1" style={IS} /></div>
              <div><label style={LS}>หน่วย</label><input value={curItem.unit} readOnly style={{ ...IS,opacity:0.5 }} /></div>
            </div>
            <label style={LS}>หมายเหตุ</label>
            <input value={note} onChange={e=>setNote(e.target.value)} placeholder={mode==='restock'?'แหล่งที่มา / PO (ไม่บังคับ)':'แผนก / เหตุผล (ไม่บังคับ)'} style={IS} />

            <button onClick={handleConfirm} style={{ width:'100%',padding:'15px',borderRadius:'20px',border:'none',background:mc.grad,color:'#fff',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'15px',fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',boxShadow:mc.shadow,marginTop:'14px' }}>
              <i className={`ti ${mc.icon}`} style={{ fontSize:'18px' }} /> {mc.btnLabel}
            </button>
          </div>
          <button onClick={onCancel} style={{ width:'100%',padding:'13px',borderRadius:'20px',border:'1.5px solid var(--teal-border)',background:'var(--surface)',color:'var(--txt2)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'15px',fontWeight:600,cursor:'pointer',marginTop:'8px' }}>ยกเลิก</button>
        </div>
      );
    }

    /* ─── PageScan ─── */
    function PageScan({ items, curItem, onScan, onConfirm, onCancel, onOpenCamera }) {
      const [manualCode,setManualCode] = useState('');
      const [nameSearch,setNameSearch] = useState('');
      const [searchResults,setSearchResults] = useState([]);

      // ค้นหาโดยชื่อ (fuzzy)
      useEffect(()=>{
        if (!nameSearch.trim()) { setSearchResults([]); return; }
        const results = items.filter(it => fuzzyMatch(it.name, nameSearch) || fuzzyMatch(it.cat, nameSearch));
        setSearchResults(results);
      },[nameSearch, items]);

      const IS={background:'var(--surface)',border:'1.5px solid var(--teal-border)',borderRadius:'14px',color:'var(--txt)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'14px',padding:'13px 14px',width:'100%',outline:'none',boxShadow:'var(--shadow-sm)'};
      const sampleChips=items.slice(0,6);

      if (curItem) {
        return <ItemActionPanel curItem={curItem} onConfirm={onConfirm} onCancel={onCancel} />;
      }

      return (
        <div style={{ animation:'fadeUp .2s ease' }}>
          <div onClick={onOpenCamera} style={{ margin:'20px 0 16px',textAlign:'center',padding:'36px 20px',background:'var(--teal-dim)',border:'2px dashed var(--teal-border)',borderRadius:'28px',cursor:'pointer' }}>
            <i className="ti ti-camera" style={{ fontSize:'48px',color:'var(--teal)',display:'block',marginBottom:'10px' }} />
            <div style={{ fontFamily:"'Outfit',sans-serif",fontSize:'22px',fontWeight:800,color:'var(--navy)',letterSpacing:'-0.5px' }}>แตะเพื่อเปิดกล้อง</div>
            <div style={{ fontSize:'12px',color:'var(--txt3)',marginTop:'4px' }}>สแกน QR Code ด้วยกล้องโทรศัพท์</div>
          </div>

          {/* ── ส่วนค้นหา ─────────────────────────────────── */}
          <div style={{ display:'flex',alignItems:'center',gap:'10px',margin:'4px 0 12px' }}>
            <div style={{ flex:1,height:'1px',background:'var(--teal-border)' }} />
            <span style={{ fontSize:'11px',color:'var(--txt3)' }}>หรือค้นหา</span>
            <div style={{ flex:1,height:'1px',background:'var(--teal-border)' }} />
          </div>

          {/* ค้นหาด้วยชื่อ */}
          <div style={{ position:'relative',marginBottom:'10px' }}>
            <i className="ti ti-search" style={{ position:'absolute',left:'14px',top:'50%',transform:'translateY(-50%)',fontSize:'16px',color:'var(--txt3)',pointerEvents:'none' }} />
            <input
              value={nameSearch}
              onChange={e=>setNameSearch(e.target.value)}
              placeholder="ค้นหาชื่ออุปกรณ์ เช่น กระดาษ, ปากกา..."
              style={{ ...IS,paddingLeft:'40px' }}
            />
          </div>

          {/* ผลลัพธ์การค้นหาชื่อ */}
          {nameSearch.trim() && (
            <div style={{ background:'var(--surface)',border:'1px solid var(--teal-border)',borderRadius:'20px',padding:'4px 16px',marginBottom:'12px',boxShadow:'var(--shadow-sm)',animation:'slideDown .2s ease' }}>
              {searchResults.length === 0
                ? <div style={{ padding:'16px 0',textAlign:'center',color:'var(--txt3)',fontSize:'13px' }}>ไม่พบอุปกรณ์ที่ตรงกัน</div>
                : searchResults.map((it,i)=>(
                    <div key={it.id} onClick={()=>onScan(it.id)} style={{ display:'flex',alignItems:'center',gap:'10px',padding:'10px 0',borderBottom:i<searchResults.length-1?'1px solid var(--teal-border)':'none',cursor:'pointer' }}>
                      <div style={{ width:'40px',height:'40px',borderRadius:'12px',background:'var(--teal-dim)',border:'1px solid var(--teal-border)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px',flexShrink:0 }}>{it.icon}</div>
                      <div style={{ flex:1,minWidth:0 }}>
                        <div style={{ fontWeight:700,fontSize:'13px',color:'var(--txt)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap' }}>{it.name}</div>
                        <div style={{ fontSize:'11px',color:'var(--txt2)' }}>{it.cat} · {it.stock} {it.unit}</div>
                      </div>
                      <div style={{ display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'3px' }}>
                        <span style={{ fontFamily:"'Space Mono',monospace",fontSize:'10px',color:'var(--txt3)' }}>{it.id}</span>
                        <span style={{ display:'inline-flex',padding:'2px 8px',borderRadius:'100px',fontSize:'10px',fontWeight:600,background:it.stock<=it.min?'#FFF4EC':'var(--teal-dim)',color:it.stock<=it.min?'#CC6A00':'var(--mid-teal)',border:`1px solid ${it.stock<=it.min?'#FFC899':'var(--teal-border)'}` }}>{it.stock<=it.min?'ใกล้หมด':'ปกติ'}</span>
                      </div>
                    </div>
                  ))
              }
            </div>
          )}

          {/* ค้นหาด้วยรหัส QR */}
          <div style={{ display:'flex',gap:'8px',marginBottom:'10px' }}>
            <input
              id="manual-input"
              value={manualCode}
              onChange={e=>setManualCode(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&onScan(manualCode.trim())}
              placeholder="พิมพ์รหัส QR เช่น QR-PAPER1"
              style={{ ...IS,flex:1 }}
            />
            <button onClick={()=>{if(manualCode.trim())onScan(manualCode.trim());}} style={{ padding:'13px 16px',borderRadius:'14px',border:'1.5px solid var(--teal-border)',background:'var(--surface)',color:'var(--txt2)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'13px',fontWeight:600,cursor:'pointer',whiteSpace:'nowrap' }}>ค้นหา</button>
          </div>

          {sampleChips.length>0&&(
            <div style={{ marginTop:'12px' }}>
              <div style={{ fontFamily:"'Space Mono',monospace",fontSize:'10px',color:'var(--txt3)',letterSpacing:'1.6px',textTransform:'uppercase',marginBottom:'8px' }}>QR ตัวอย่าง (แตะทดสอบ)</div>
              <div style={{ display:'flex',gap:'6px',flexWrap:'wrap' }}>
                {sampleChips.map(it=>(
                  <div key={it.id} onClick={()=>onScan(it.id)} style={{ padding:'6px 12px',borderRadius:'100px',background:'var(--surface)',border:'1.5px solid var(--teal-border)',fontFamily:"'Space Mono',monospace",fontSize:'11px',color:'var(--teal)',cursor:'pointer',boxShadow:'var(--shadow-sm)' }}>{it.icon} {it.id}</div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ─── PageLog ─── */
    function PageLog({ logs, items, onSync }) {
      const [search,setSearch]=useState('');
      const [fw,setFw]=useState('week');
      const [showDebug,setShowDebug]=useState(false);
      const now=new Date(), ws=new Date(now);
      ws.setDate(now.getDate()-now.getDay()); ws.setHours(0,0,0,0);
      const filtered=logs.filter(l=>{
        const q=search.toLowerCase();
        const m=!q||(l.item_name||'').toLowerCase().includes(q)||(l.employee||'').toLowerCase().includes(q)||(l.qr_id||'').toLowerCase().includes(q);
        if(!m)return false; if(fw==='all')return true;
        const d=parseTs(l.timestamp); if(!d)return false;
        if(fw==='today')return d.toDateString()===now.toDateString();
        if(fw==='week')return d>=ws;
        if(fw==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
        return true;
      });
      const totalQty=filtered.reduce((s,l)=>s+(Number(l.quantity)||0),0);
      const uniqueEmp=new Set(filtered.map(l=>l.employee).filter(Boolean)).size;
      const uniqueItem=new Set(filtered.map(l=>l.item_name).filter(Boolean)).size;
      const SS={background:'var(--surface)',border:'1.5px solid var(--teal-border)',borderRadius:'14px',color:'var(--txt)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'13px',padding:'10px 12px',width:'100%',outline:'none',boxShadow:'var(--shadow-sm)',WebkitAppearance:'none'};
      const IS={background:'var(--surface)',border:'1.5px solid var(--teal-border)',borderRadius:'14px',color:'var(--txt)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'14px',padding:'13px 14px',width:'100%',outline:'none',boxShadow:'var(--shadow-sm)',marginBottom:'10px'};
      const Pill=({children,color,bg,border})=>(<span style={{ display:'inline-flex',alignItems:'center',gap:'4px',padding:'4px 10px',borderRadius:'100px',fontSize:'11px',fontWeight:600,background:bg,color,border:`1px solid ${border}` }}>{children}</span>);
      return (
        <div style={{ animation:'fadeUp .2s ease' }}>
          <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginTop:'14px',marginBottom:'10px' }}>
            <select value={fw} onChange={e=>setFw(e.target.value)} style={SS}>
              <option value="all">ทุกช่วงเวลา</option><option value="today">วันนี้</option><option value="week">สัปดาห์นี้</option><option value="month">เดือนนี้</option>
            </select>
            <button onClick={onSync} style={{ padding:'10px 16px',borderRadius:'14px',border:'1.5px solid var(--teal-border)',background:'var(--surface)',color:'var(--txt2)',fontFamily:"'Noto Sans Thai',sans-serif",fontSize:'13px',fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'6px' }}>
              <i className="ti ti-refresh" style={{ fontSize:'15px' }} /> รีเฟรช
            </button>
          </div>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="ค้นหาชื่อ หรืออุปกรณ์..." style={IS} />
          {filtered.length>0&&(
            <div style={{ display:'flex',gap:'6px',marginBottom:'12px',flexWrap:'wrap' }}>
              <Pill color="var(--mid-teal)" bg="var(--teal-dim)" border="var(--teal-border)"><i className="ti ti-list-check" style={{ fontSize:'11px' }} /> {filtered.length} รายการ</Pill>
              <Pill color="var(--mid-teal)" bg="var(--mint-dim)" border="var(--mint-border)"><i className="ti ti-box" style={{ fontSize:'11px' }} /> {uniqueItem} ชนิด</Pill>
              <Pill color="var(--mid-teal)" bg="#E8F3F5" border="#A0CDD5"><i className="ti ti-users" style={{ fontSize:'11px' }} /> {uniqueEmp} คน</Pill>
              <Pill color="#CC6A00" bg="#FFF4EC" border="#FFC899"><i className="ti ti-stack-2" style={{ fontSize:'11px' }} /> รวม {totalQty} ชิ้น</Pill>
            </div>
          )}
          <div style={{ display:'flex',alignItems:'center',gap:'10px',padding:'0 0 6px',borderBottom:'1px solid var(--teal-border)' }}>
            <div style={{ width:'40px',flexShrink:0 }} />
            <div style={{ flex:1,fontFamily:"'Space Mono',monospace",fontSize:'9px',color:'var(--txt3)',letterSpacing:'1.2px',textTransform:'uppercase' }}>อุปกรณ์ / ผู้ดำเนินการ</div>

    /* ─── GAS Code string ─── */
    const GAS_CODE = `function doGet(e) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let itemSh = ss.getSheetByName("Items");
  let logSh  = ss.getSheetByName("Logs");
  if (!itemSh) { itemSh = ss.insertSheet("Items"); itemSh.appendRow(["ID","Name","Category","Stock","Unit","Min","Icon"]); }
  if (!logSh)  { logSh  = ss.insertSheet("Logs");  logSh.appendRow(["Timestamp","QR_ID","Item_Name","Category","Quantity","Unit","Employee","Note","Action"]); }
  const payload = JSON.stringify({ items: getItems(itemSh), logs: getLogs(logSh) });
  const cb = e && e.parameter && e.parameter.callback;
  if (cb) return ContentService.createTextOutput(cb+"("+payload+")").setMimeType(ContentService.MimeType.JAVASCRIPT);
  return ContentService.createTextOutput(payload).setMimeType(ContentService.MimeType.JSON);
}
function doPost(e) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const itemSh = ss.getSheetByName("Items") || (() => { const s=ss.insertSheet("Items"); s.appendRow(["ID","Name","Category","Stock","Unit","Min","Icon"]); return s; })();
  const logSh  = ss.getSheetByName("Logs")  || (() => { const s=ss.insertSheet("Logs");  s.appendRow(["Timestamp","QR_ID","Item_Name","Category","Quantity","Unit","Employee","Note","Action"]); return s; })();
  const data = JSON.parse(e.postData.contents);
  if (data.action === "add_items") { data.items.forEach(it => itemSh.appendRow([it.id, it.name, it.cat, it.stock, it.unit, it.min, it.icon])); }
  else if (data.action === "withdraw" || data.action === "return" || data.action === "restock") {
    logSh.appendRow([data.timestamp, data.qr_id, data.item_name, data.category, data.quantity, data.unit, data.employee, data.note || "", data.action]);
    const vals = itemSh.getDataRange().getValues();
    for (let i = 1; i < vals.length; i++) {
      if (String(vals[i][0]) === String(data.qr_id)) {
        const cur = Number(vals[i][3]);
        let next = cur;
        if (data.action === "withdraw") next = Math.max(0, cur - Number(data.quantity));
        else if (data.action === "return" || data.action === "restock") next = cur + Number(data.quantity);
        itemSh.getRange(i+1,4).setValue(next);
        break;
      }
    }
  }
  else if (data.action === "delete_item") {
    const vals = itemSh.getDataRange().getValues();
    for (let i = 1; i < vals.length; i++) { if (String(vals[i][0]) === String(data.id)) { itemSh.deleteRow(i+1); break; } }
  }
  return ContentService.createTextOutput(JSON.stringify({status:"ok"})).setMimeType(ContentService.MimeType.JSON);
}
function getItems(sheet) {
  const rows = sheet.getDataRange().getValues(); if (rows.length < 2) return [];
  const h = rows[0].map(c => String(c).trim().toLowerCase()); const col = k => h.indexOf(k);
  return rows.slice(1).map(r => ({ id: String(r[col('id')]||''), name: String(r[col('name')]||''), cat: String(r[col('category')]||r[col('cat')]||''), stock: Number(r[col('stock')])||0, unit: String(r[col('unit')]||'อัน'), min: Number(r[col('min')])||0, icon: String(r[col('icon')]||'📦') })).filter(it => it.id);
}
function getLogs(sheet) {
  const rows = sheet.getDataRange().getValues(); if (rows.length < 2) return [];
  return rows.slice(1).reverse().slice(0,100).map(r => { let qty = parseInt(r[4]); if (isNaN(qty)) qty = 0; return { timestamp: String(r[0]||''), qr_id: String(r[1]||''), item_name: String(r[2]||''), category: String(r[3]||''), quantity: qty, unit: String(r[5]||''), employee: String(r[6]||''), note: String(r[7]||''), action: String(r[8]||'withdraw') }; });
}`;

      async function fetchViaFetch(url){const res=await fetch(url+(url.includes('?')?'&':'?')+'_t='+Date.now(),{method:'GET',redirect:'follow'});const text=await res.text();const clean=text.trim();if(clean.startsWith('{')||clean.startsWith('['))return JSON.parse(clean);const m=clean.match(/^[^(]+\((.+)\)\s*;?\s*$/s);if(m)return JSON.parse(m[1]);throw new Error('Unexpected response');}
      function fetchViaJsonp(url){return new Promise((resolve,reject)=>{const cbName='_gs_'+Date.now()+'_'+Math.floor(Math.random()*99999);const script=document.createElement('script');let settled=false;const finish=fn=>{if(settled)return;settled=true;clearTimeout(timer);delete window[cbName];if(script.parentNode)script.parentNode.removeChild(script);fn();};const timer=setTimeout(()=>finish(()=>reject(new Error('timeout'))),15000);window[cbName]=data=>finish(()=>resolve(data));script.src=url+(url.includes('?')?'&':'?')+'callback='+cbName+'&_t='+Date.now();script.onerror=()=>finish(()=>reject(new Error('blocked')));document.head.appendChild(script);});}
      async function gasPost(url,body){const res=await fetch(url,{method:'POST',body:JSON.stringify(body)});try{return JSON.parse(await res.text());}catch(e){return{status:'ok'};}}
      function applyResponseData(data){if(!data||!Array.isArray(data.items))throw new Error('No items');setItems(normalizeItems(data.items));setLogs(normalizeLogs(data.logs||[]));}

      async function syncData(){
        if(!cfg.url){setSyncStatus('none');return;} if(isSyncing)return;
        setIsSyncing(true);setSyncStatus('syncing');let ok=false;
        try{const d=await fetchViaFetch(cfg.url);applyResponseData(d);setSyncStatus('ok');ok=true;}catch(e1){try{const d=await fetchViaJsonp(cfg.url);applyResponseData(d);setSyncStatus('ok');ok=true;}catch(e2){}}
        if(!ok){setSyncStatus('error');showToast('ซิงค์ไม่ได้ — ตรวจ GAS URL หรือเน็ต','#FF4D4D');}
        setIsSyncing(false);
      }

      function requestAdminAccess(){setActivePage('admin');if(!setupUnlocked)setPinTarget('admin');}
      function requestSetupAccess(){setActivePage('setup');if(!setupUnlocked)setPinTarget('setup');}
      function onPinSuccess(target){setSetupUnlocked(true);setPinTarget(null);showToast(target==='setup'?'✓ เข้าสู่หน้าตั้งค่าแล้ว':'✓ เข้าสู่โหมด Admin แล้ว');}
      function lockAdmin(){setSetupUnlocked(false);showToast('🔒 ล็อค Admin แล้ว');setActivePage('home');}

      function scanItem(code){const it=items.find(x=>x.id===code);if(!it){showToast('ไม่เจอ QR นี้ในระบบ ❌','#FF4D4D');return;}setCurItem(it);setActivePage('scan');}

      async function confirmAction(mode, user, qty, note) {
        if(!curItem)return;
        if(!user){showToast('ใส่ชื่อผู้ดำเนินการด้วยนะ ⚠','#FFB700');return;}
        if(qty<1){showToast('จำนวนต้องมากกว่า 0','#FFB700');return;}
        if(mode==='withdraw' && qty>curItem.stock){showToast('จำนวนเกินสต๊อก ❌','#FF4D4D');return;}

        const ts=nowISO(); const snap={...curItem};
        const modeLabel = mode==='withdraw'?'เบิก': mode==='return'?'คืน':'เติม Stock';
        const toastColor = mode==='withdraw'?'#213A58': mode==='return'?'#4A90D9':'var(--mid-teal)';

        // อัปเดต stock ในเครื่อง
        setItems(prev=>prev.map(x=>{
          if(x.id!==snap.id)return x;
          if(mode==='withdraw') return {...x,stock:x.stock-qty};
          if(mode==='return')   return {...x,stock:x.stock+qty};
          if(mode==='restock')  return {...x,stock:x.stock+qty};
          return x;
        }));

        setLogs(prev=>[{timestamp:ts,qr_id:snap.id,item_name:snap.name,cat:snap.cat,quantity:qty,unit:snap.unit,employee:user,note:note||'',action:mode},...prev]);
        setCurItem(null);
        showToast(`กำลังบันทึก${modeLabel} "${snap.name}" ☁...`, toastColor);

        if(cfg.url){
          try{
            await gasPost(cfg.url,{action:mode,timestamp:ts,qr_id:snap.id,item_name:snap.name,category:snap.cat,quantity:qty,unit:snap.unit,employee:user,note:note||''});
            showToast(`${modeLabel} "${snap.name}" ${qty} ${snap.unit} สำเร็จ ✓`, toastColor);
            setTimeout(syncData,1000);
          }catch(e){
            showToast(`บันทึกในเครื่องแล้ว (ส่งไป Sheet ไม่ได้)`,'#FFB700');
          }
        } else {
          showToast('บันทึกในเครื่องแล้ว (ยังไม่ได้เชื่อม Sheet)','#FFB700');
        }
      }

      async function addItem(formData){
        if(!cfg.url){showToast('กรุณาตั้งค่า GAS URL ก่อน ⚠','#FFB700');return;}
        const{name,cat,stock,unit,min,icon,count}=formData;
        if(!name){showToast('ใส่ชื่ออุปกรณ์ด้วยนะ ⚠','#FFB700');return;}
        const cnt=Math.max(1,parseInt(count)||1);
        const newItems=Array.from({length:cnt},()=>({id:uid(),name,cat,stock:parseInt(stock)||0,unit:unit||'อัน',min:parseInt(min)||10,icon:icon||'📦'}));
        showToast(`กำลังบันทึก "${name}" ${cnt} ชิ้น ☁...`);
        try{await gasPost(cfg.url,{action:'add_items',items:newItems});showToast(`บันทึก "${name}" สำเร็จ ✓`);await syncData();}catch(e){showToast('มีปัญหาการส่งไป Sheet','#FF4D4D');}
      }

      async function delItem(id){
        if(!confirm('ยืนยันการลบอุปกรณ์นี้?'))return;
        if(!cfg.url){showToast('ยังไม่ได้เชื่อม Sheet','#FFB700');return;}
        try{await gasPost(cfg.url,{action:'delete_item',id});showToast('ลบแล้ว ✓');await syncData();}catch(e){showToast('ลบไม่สำเร็จ','#FF4D4D');}
      }

      function saveSettings(url){const newCfg={...cfg,url};setCfg(newCfg);setTimeout(syncData,200);}
      function copyGAS(){navigator.clipboard.writeText(GAS_CODE).then(()=>showToast('Copy โค้ด GAS แล้ว ✓')).catch(()=>showToast('Copy ไม่ได้ — ลอง Copy เอง','#FFB700'));}

      return (
        <div style={{ fontFamily:"'Noto Sans Thai',sans-serif",background:'var(--bg)',color:'var(--txt)',maxWidth:'390px',margin:'0 auto',minHeight:'100vh',overflowX:'hidden',paddingBottom:'88px' }}>
          <TopBar syncStatus={syncStatus} onSync={syncData} />
          <div style={{ padding:'0 14px' }}>
            {activePage==='home'&&<PageHome items={items} logs={logs} onGoScan={()=>setActivePage('scan')} />}
            {activePage==='scan'&&<PageScan items={items} curItem={curItem} onScan={scanItem} onConfirm={confirmAction} onCancel={()=>setCurItem(null)} onOpenCamera={()=>setShowCamera(true)} />}
            {activePage==='log'&&<PageLog logs={logs} items={items} onSync={syncData} />}
            {activePage==='admin'&&<PageAdmin items={items} setupUnlocked={setupUnlocked} onAddItem={addItem} onDelItem={delItem} onLock={lockAdmin} onUnlock={requestAdminAccess} />}
            {activePage==='setup'&&<PageSetup cfg={cfg} setupUnlocked={setupUnlocked} syncStatus={syncStatus} onSave={saveSettings} onSync={syncData} onCopyGAS={copyGAS} onLock={()=>{setSetupUnlocked(false);showToast('🔒 ล็อค ตั้งค่า แล้ว');setActivePage('home');}} onUnlock={requestSetupAccess} />}
          </div>
          <BottomNav activePage={activePage} onGoHome={()=>setActivePage('home')} onGoLog={()=>setActivePage('log')} onGoScan={()=>setActivePage('scan')} onGoAdmin={requestAdminAccess} onGoSetup={requestSetupAccess} />
          {pinTarget&&<PinModal target={pinTarget} correctPin={SECURE_PIN} onSuccess={()=>onPinSuccess(pinTarget)} onClose={()=>{setPinTarget(null);if(!setupUnlocked)setActivePage('home');}} />}
          {showCamera&&<CameraOverlay onScan={code=>{setShowCamera(false);scanItem(code);}} onClose={()=>setShowCamera(false)} />}
          {toast&&(
            <div style={{ position:'fixed',bottom:'96px',left:'50%',transform:'translateX(-50%)',background:toast.color,color:'#fff',borderRadius:'100px',padding:'12px 24px',fontSize:'13px',zIndex:300,whiteSpace:'nowrap',boxShadow:'0 8px 32px rgba(33,58,88,0.2)',animation:'toastPop .3s cubic-bezier(0.34,1.56,0.64,1)' }}>{toast.msg}</div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StockScan />);
  </script>
</body>
</html>
